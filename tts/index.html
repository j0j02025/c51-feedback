<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TTS 评审</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <nav id="languages" aria-label="界面语言"></nav>
    <a id="login" class="login" hidden>飞书登录</a>
    <span id="session-status" role="status"></span>
  </div>
</header>
<main>
  <h1 data-t="title">TTS 评审</h1>
  <p id="load-state" role="status">正在加载…</p>
  <div id="reviews"></div>
</main>
<template id="clip-template">
  <article class="card">
    <h3></h3>
    <p class="transcript"></p>
    <audio controls preload="none"></audio>
    <div class="audio-error" hidden>
      <span data-t="playbackFailed"></span>
      <button type="button" data-audio-retry data-t="retryAudio"></button>
    </div>
    <form>
      <fieldset>
        <legend data-t="rating">自然度</legend>
        <div class="choices stars"></div>
      </fieldset>
      <fieldset>
        <legend data-t="conclusion">能直接上课吗？</legend>
        <div class="choices verdicts"></div>
      </fieldset>
      <div class="wrong"></div>
      <label class="notes">
        <span data-t="notes">备注（选填）</span>
        <textarea rows="2" maxlength="2000"></textarea>
      </label>
      <div class="actions">
        <button type="submit" class="primary"></button>
        <button type="button" data-remove data-t="remove" hidden></button>
        <button type="button" data-reload data-t="reload" hidden></button>
      </div>
    </form>
    <p class="status" role="status"></p>
  </article>
</template>
</body>
</html>
