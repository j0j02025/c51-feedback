const SLOTS={};document.querySelectorAll('img[data-slot]').forEach(im=>SLOTS[im.dataset.slot]=im);

// 多帧角色:<槽名>_f0 … 共用一个并集紧框,切帧时身体不跳;没有图时画占位色块,整条流程照样能跑通与验收
function frameSlot(name,k,frames){return frames>1?`${name}_f${k%frames}`:name}
function trimGroup(name,frames){

}

// 脚底站在 (cx,ground),登记碰撞框 = 实际画出的框。接地阴影按 theme.light.shadow_dx 偏移,和背景同一光向
function drawSprite(name,cx,ground,maxW,maxH,opt={}){
 const frames=opt.frames||1,bob=opt.bob||0,tilt=opt.tilt||0,tr=trimGroup(name,frames),ready=!!tr,k=ready?Math.min(maxW/tr.w,maxH/tr.h):1,w=ready?tr.w*k:maxW,h=ready?tr.h*k:maxH,x=cx-w/2,y=ground-h+bob;
 const dx=(TH.light&&TH.light.shadow_dx)||0;
 ctx.fillStyle=(TH.light&&TH.light.shadow)||'rgba(42,31,61,.18)';ctx.beginPath();ctx.ellipse(cx+dx,ground+2,w*0.4,10,0,0,7);ctx.fill();
 ctx.save();ctx.translate(cx,ground+bob);ctx.rotate(tilt);ctx.translate(-cx,-(ground+bob));
 if(ready)ctx.drawImage(SLOTS[frameSlot(name,opt.frame||0,frames)],tr.x,tr.y,tr.w,tr.h,x,y,w,h);

}

// ---- 样式:控制条住在画面下面(不压画面、不压字幕);收起时只剩一个小开关 ----
const HAND='255px 15px 225px 15px/15px 225px 15px 255px';
const R=PAPER?HAND:C.radius+'px';
const st=document.createElement('style');st.id='cvControlsCss';st.textContent=`
html.cv-on{--cvh:46px}html.cv-on.cv-min{--cvh:26px}
html.cv-on .stage{flex-direction:column}
html.cv-on .card,#cvBar{flex:none;width:min(100vw,calc((100vh - var(--cvh)) * 1.777777))}
html.cv-on .card{height:min(calc(100vh - var(--cvh)),56.25vw)}
#cvBar{height:var(--cvh);display:flex;align-items:center;gap:8px;padding:0 8px;font-family:${CFONT};color:${C.fg};user-select:none;-webkit-user-select:none}
#cvBar button,#cvReplay{appearance:none;-webkit-appearance:none;margin:0;font:inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:${C.fg};background:${CHIP};border:${PAPER?'2px solid '+C.fg:'0'};border-radius:${R};box-shadow:none;padding:0}
#cvBar button{height:34px;min-width:38px}
#cvBar button:focus-visible,#cvReplay:focus-visible{outline:2px dashed ${C.accent};outline-offset:2px}
#cvBar button:hover{filter:brightness(${PAPER?0.97:1.12})}
#cvBar .cv-txt{padding:0 10px;font-size:14px;font-weight:700;white-space:nowrap}
#cvBar button[aria-pressed=true]{background:${C.accent};color:${ONFG}}
#cvSeg{flex:none;font-size:14px;font-weight:700;white-space:nowrap;min-width:8.5em;text-align:center}
#cvTrack{flex:1;position:relative;height:${PAPER?12:10}px;cursor:pointer;background:${PAPER?C.bg:CHIP};border:${PAPER?'2px solid '+C.fg:'0'};border-radius:${PAPER?'40px 8px 50px 6px/8px 50px 6px 40px':'999px'};overflow:hidden}
#cvFill{position:absolute;left:0;top:0;bottom:0;width:0;background:${FILL}}
#cvTrack i{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:${PAPER?C.fg:ONFG};opacity:${PAPER?.55:.45}}
#cvBar #cvMin{margin-left:auto}
html.cv-min #cvBar>*:not(#cvMin){display:none}
html.cv-min #cvBar button#cvMin{height:20px;min-width:30px}
#cvReplay{position:absolute;left:50%;top:44%;width:112px;height:112px;margin:-56px 0 0 -56px;z-index:6;border-radius:${PAPER?'52% 48% 50% 50%/48% 52% 48% 52%':'50%'};background:${PAPER?C.bg:C.accent};color:${PAPER?C.fg:ONFG};border:${PAPER?'3px solid '+C.fg:'0'}}
#cvReplay svg{width:60px;height:60px}
#cvReplay[hidden]{display:none}
`;document.head.appendChild(st);
// ---- DOM ----
const bar=document.createElement('div');bar.id='cvBar';bar.dataset.cvControls='bar';bar.setAttribute('role','toolbar');bar.setAttribute('aria-label','播放控制');
bar.innerHTML=`<button type="button" data-cv-ctl="prev" aria-label="上一段" title="上一段">${svg('prev')}</button>`+
 `<button type="button" data-cv-ctl="play" aria-label="暂停" title="暂停">${svg('pause')}</button>`+
 `<button type="button" data-cv-ctl="next" aria-label="下一段" title="下一段">${svg('next')}</button>`+
 `<span id="cvSeg"></span><div id="cvTrack" data-cv-ctl="seek" title="跳到这里"><div id="cvFill"></div>${SEG.slice(1).map(s=>`<i style="left:${(100*s/AUDIO_DUR).toFixed(3)}%"></i>`).join('')}</div>`+
 (typeof zhCaption!=='undefined'&&zhCaption&&!(CFG.lang_switch&&CFG.langs.includes('zh'))?`<button type="button" class="cv-txt" data-cv-ctl="zh" aria-pressed="false" title="中文字幕">中文字幕</button>`:'')+
 (document.fullscreenEnabled?`<button type="button" data-cv-ctl="fs" aria-label="全屏" title="全屏">${svg('fs')}</button>`:'')+
 `<button type="button" id="cvMin" data-cv-ctl="min" aria-label="收起控制条" title="收起控制条">${svg('down')}</button>`;
document.querySelector('.stage').appendChild(bar);
const rp=document.createElement('button');rp.type='button';rp.id='cvReplay';rp.dataset.cvControls='replay';rp.dataset.cvCtl='replay';rp.hidden=true;rp.setAttribute('aria-label','重放');rp.title='重放';rp.innerHTML=svg('replay');
document.querySelector('.card').appendChild(rp);
document.documentElement.classList.add('cv-on');
const $=n=>bar.querySelector(`[data-cv-ctl="${n}"]`);
// ---- 点控制条不触发外壳「点一下回开头带声重播」;静音中第一次点控制条只顺手开声 ----
for(const el of[bar,rp]){
 el.addEventListener('pointerdown',e=>{e.stopPropagation();if(narration.muted){narration.muted=false;if(typeof audioKick==='function')audioKick();if(typeof syncHint==='function')syncHint()}});
 el.addEventListener('keydown',e=>e.stopPropagation());
}
// ---- 动作:全部走外壳的 sync(唯一时钟 narration.currentTime),配音和画面一起跳 ----
const play=()=>{if(typeof audioKick==='function')audioKick();narration.play().catch(()=>{})};
function go(s){const keep=!narration.paused||atEnd();sync(s);if(keep)play()}
function replay(){if(typeof live==='object'&&live&&live.done&&live.amb&&live.ctx){live.done=false;live.amb.gain.setTargetAtTime(typeof AMBG==='function'?AMBG():.06,live.ctx.currentTime,.3)}sync(0);play()}
$('prev').onclick=()=>{const k=segOf(t);go(SEG[t-SEG[k]>1.5?k:Math.max(0,k-1)])};
$('next').onclick=()=>{const k=segOf(t);if(k+1<M)go(SEG[k+1])};
$('play').onclick=()=>{if(atEnd())replay();else if(narration.paused)play();else narration.pause()};
rp.onclick=replay;
const tr=bar.querySelector('#cvTrack');
tr.addEventListener('click',e=>{const r=tr.getBoundingClientRect();go(Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*AUDIO_DUR)});
if($('zh'))$('zh').onclick=()=>{zhCaption.hidden=!zhCaption.hidden};
if($('fs'))$('fs').onclick=()=>{document.fullscreenElement?document.exitFullscreen().catch(()=>{}):document.documentElement.requestFullscreen().catch(()=>{})};
$('min').onclick=()=>{const m=document.documentElement.classList.toggle('cv-min');$('min').innerHTML=svg(m?'up':'down');$('min').setAttribute('aria-label',m?'展开控制条':'收起控制条');$('min').title=$('min').getAttribute('aria-label')};
// 用户暂停时 BGM 和环境声一起停(外壳 bgmTick 只管开不管停);播到尾的淡出仍归外壳
narration.addEventListener('pause',()=>{if(atEnd())return;if(typeof bgm!=='undefined'&&bgm&&!bgm.paused)bgm.pause();if(typeof live==='object'&&live&&live.ctx&&live.ctx.state==='running')live.ctx.suspend().catch(()=>{})});
narration.addEventListener('play',()=>{if(typeof live==='object'&&live&&live.ctx&&live.ctx.state==='suspended')live.ctx.resume().catch(()=>{})});
// ---- 控件文字:多语切换片(CFG.lang_switch,templates/lang4.js)跟当前语言(<html lang>)走,四语;单语片 / 老片一律中文,与改前相同 ----
const UI={
 zh:{seg:(k,m)=>`第 ${k} / 共 ${m} 段`,prev:'上一段',next:'下一段',play:'继续',pause:'暂停',replay:'重放',seek:'跳到这里',fs:'全屏',fsx:'退出全屏',min:'收起控制条',max:'展开控制条',bar:'播放控制'},
 kk:{seg:(k,m)=>`Бөлім ${k} / ${m}`,prev:'Алдыңғы бөлім',next:'Келесі бөлім',play:'Жалғастыру',pause:'Кідірту',replay:'Қайта ойнату',seek:'Осы жерге өту',fs:'Толық экран',fsx:'Толық экраннан шығу',min:'Басқару жолағын жасыру',max:'Басқару жолағын көрсету',bar:'Ойнату басқаруы'},
 ru:{seg:(k,m)=>`Часть ${k} / ${m}`,prev:'Предыдущая часть',next:'Следующая часть',play:'Продолжить',pause:'Пауза',replay:'Повторить',seek:'Перейти сюда',fs:'Полный экран',fsx:'Выйти из полного экрана',min:'Скрыть панель',max:'Показать панель',bar:'Управление воспроизведением'},
 en:{seg:(k,m)=>`Part ${k} / ${m}`,prev:'Previous part',next:'Next part',play:'Resume',pause:'Pause',replay:'Replay',seek:'Jump here',fs:'Full screen',fsx:'Exit full screen',min:'Hide controls',max:'Show controls',bar:'Playback controls'}};
const ui=()=>CFG.lang_switch&&UI[document.documentElement.lang]||UI.zh;
const lab=(el,s)=>{if(el){el.setAttribute('aria-label',s);el.title=s}};
// ---- 状态刷新:每帧只读不写时钟 ----
let last='';
function paint(){
 const end=atEnd(),paused=narration.paused,k=segOf(t),zh=!!($('zh')&&!zhCaption.hidden),fs=!!document.fullscreenElement,U=ui(),mn=document.documentElement.classList.contains('cv-min');
 const key=[end,paused,k,zh,fs,document.documentElement.lang,mn].join('|');
 bar.querySelector('#cvFill').style.width=(100*Math.min(1,t/AUDIO_DUR)).toFixed(2)+'%';
 if(key!==last){last=key;
  const b=$('play');b.innerHTML=svg(end?'replay':paused?'play':'pause');lab(b,end?U.replay:paused?U.play:U.pause);
  bar.querySelector('#cvSeg').textContent=U.seg(k+1,M);
  $('prev').disabled=false;$('next').disabled=k+1>=M;$('next').style.opacity=k+1>=M?.4:'';
  if($('zh'))$('zh').setAttribute('aria-pressed',String(zh));
  if($('fs')){$('fs').innerHTML=svg(fs?'fsx':'fs');$('fs').setAttribute('aria-label',fs?U.fsx:U.fs)}
  if(CFG.lang_switch){lab($('prev'),U.prev);lab($('next'),U.next);bar.querySelector('#cvTrack').title=U.seek;if($('fs'))$('fs').title=fs?U.fsx:U.fs;lab($('min'),mn?U.max:U.min);lab(rp,U.replay);bar.setAttribute('aria-label',U.bar)}
  rp.hidden=!end;
 }
 requestAnimationFrame(paint);
}
paint();
// 逐帧渲染(出 MP4)时整条拆掉,画面回到满幅
const R0=window.render;window.render=s=>{if(document.documentElement.classList.contains('cv-on')){bar.remove();rp.remove();st.remove();document.documentElement.classList.remove('cv-on','cv-min')}return R0(s)};
window.__cvControls={segments:SEG.slice(),version:1};
})();
</script>
<!-- controls:end -->
</body></html>
