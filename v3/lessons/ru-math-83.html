// 每种音效解释什么 —— pop = 纸上出现一样新东西;scribble = 铅笔写下竖式的一位 / 划掉;sweep = 金色记号笔划过重点;swish = 换一屏或卡片挪位;
// query = 提问;block = 倒数一秒;ding = 揭晓正确答案 / 答案框;chime = 标题、小结要点出现。环境底音 room = 很轻的室内空气声(不抢旁白)。

const SFXCFG=Object.assign({ambience:'room'},TH.sfx||{});
const ASR=44100,prng=seed=>{let x=seed>>>0||1;return()=>{x^=x<<13;x>>>=0;x^=x>>>17;x^=x<<5;x>>>=0;return x/4294967296}};
function tone(o,dest,{type='sine',f0,f1,at=0,dur=.2,gain=.5,a=.003,lp,hp,q=.7}){
 const s=o.createOscillator(),g=o.createGain();s.type=type;s.frequency.setValueAtTime(f0,at);if(f1)s.frequency.exponentialRampToValueAtTime(f1,at+dur);
 g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(gain,at+a);g.gain.exponentialRampToValueAtTime(.0001,at+dur);
 let n=s;if(lp){const f=o.createBiquadFilter();f.type='lowpass';f.frequency.value=lp;f.Q.value=q;n.connect(f);n=f}if(hp){const f=o.createBiquadFilter();f.type='highpass';f.frequency.value=hp;n.connect(f);n=f}
 n.connect(g);g.connect(dest);s.start(at);s.stop(at+dur+.02);
}
function noiseBuf(o,sec,seed){const b=o.createBuffer(1,Math.ceil(sec*o.sampleRate),o.sampleRate),d=b.getChannelData(0),r=prng(seed);for(let i=0;i<d.length;i++)d[i]=r()*2-1;return b}
function burst(o,dest,{at=0,dur=.05,gain=.5,type='bandpass',f=1500,f1,q=1,a=.001,seed=7}){
 const s=o.createBufferSource(),fl=o.createBiquadFilter(),g=o.createGain();s.buffer=noiseBuf(o,dur+.05,seed);fl.type=type;fl.frequency.setValueAtTime(f,at);if(f1)fl.frequency.exponentialRampToValueAtTime(f1,at+dur);fl.Q.value=q;
 g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(gain,at+a);g.gain.exponentialRampToValueAtTime(.0001,at+dur);s.connect(fl);fl.connect(g);g.connect(dest);s.start(at);s.stop(at+dur+.02);
}
const RECIPES={
 pop(o,d){tone(o,d,{f0:540,f1:1080,dur:.09,gain:.75,a:.002});tone(o,d,{type:'triangle',f0:1080,dur:.06,gain:.12,a:.002})},
 scribble(o,d,v){const k=[1,1.08,.94,1.03][v%4];[0,.055,.11,.16].forEach((at,i)=>burst(o,d,{at,dur:.05,gain:.42,type:'bandpass',f:(2600+i*300)*k,f1:(1700+i*200)*k,q:2.2,a:.004,seed:81+v*4+i}))},
 sweep(o,d){burst(o,d,{dur:.36,gain:.32,type:'bandpass',f:900,f1:3200,q:1.2,a:.04,seed:91});tone(o,d,{type:'triangle',f0:520,f1:1040,dur:.34,gain:.22,a:.02})},
 swish(o,d,v){burst(o,d,{dur:.32,gain:.36,type:'bandpass',f:1800,f1:600,q:.9,a:.05,seed:101+v})},
 query(o,d){tone(o,d,{f0:659,dur:.11,gain:.6});tone(o,d,{f0:880,at:.1,dur:.17,gain:.65})},
 ding(o,d){for(const[f,g,dur]of[[1047,.5,.6],[1568,.38,.5],[2093,.16,.36]])tone(o,d,{f0:f,dur,gain:g,a:.002})},
 chime(o,d){for(const[f,at,g]of[[784,0,.32],[1175,.07,.24],[1568,.14,.16]])tone(o,d,{f0:f,at,dur:.55,gain:g,a:.004})},
 block(o,d){tone(o,d,{f0:880,f1:520,dur:.07,gain:.55});tone(o,d,{f0:220,f1:120,dur:.13,gain:.8,a:.003})},
};
const LEN={pop:.11,scribble:.26,sweep:.4,swish:.36,query:.3,ding:.65,chime:.75,block:.16};
const SFX_TRIM={pop:.55,scribble:.5,sweep:.45,swish:.45,query:.46,ding:.31,chime:.5,block:.42};
const VARIANTS=new Set(['scribble','swish']);
async function renderSfx(id,v=0){const o=new OfflineAudioContext(2,Math.ceil(LEN[id]*ASR),ASR);RECIPES[id](o,o.destination,v);const r=await o.startRendering();for(let c=0;c<2;c++){const d=r.getChannelData(c);for(let i=0;i<d.length;i++)d[i]*=SFX_TRIM[id]}return r}
// 环境底音:20 秒循环噪声,首尾交叉淡化。room = 低通的室内空气声
async function renderAmbience(kind){
 const o=new OfflineAudioContext(1,Math.ceil(21*ASR),ASR),s=o.createBufferSource(),f=o.createBiquadFilter(),f2=o.createBiquadFilter();s.buffer=noiseBuf(o,21,5151);f.type='bandpass';f.frequency.value=kind==='room'?320:620;f.Q.value=kind==='room'?.7:.55;f2.type='lowpass';f2.frequency.value=kind==='room'?900:1500;s.connect(f);f.connect(f2);f2.connect(o.destination);s.start(0);
 const r=(await o.startRendering()).getChannelData(0),N=20*ASR,X=ASR,out=new AudioBuffer({numberOfChannels:1,length:N,sampleRate:ASR}),d=out.getChannelData(0);
 for(let i=0;i<N;i++)d[i]=r[i]*2;for(let i=0;i<X;i++){const k=i/X;d[i]=(r[i]*k+r[N+i]*(1-k))*2}

}
function buildEvents(){return (typeof SCENE_EVENTS!=='undefined'?SCENE_EVENTS:[]).filter(e=>RECIPES[e.id]).map(e=>({t:+e.t.toFixed(4),id:e.id,v:e.v||0})).sort((x,y)=>x.t-y.t)}
const SFXG=()=>MIXG.sfx==null?.35:MIXG.sfx,AMBG=()=>MIXG.ambience==null?.05:MIXG.ambience;

const sbuf=e=>{const a=SBUF.sfx[e.id];return a[e.v%a.length]};
const live={ctx:null,master:null,sfx:null,amb:null,src:null,next:0,offset:null,done:false};
function audioKick(){if(!window.AudioContext)return;if(!live.ctx){const c=live.ctx=new AudioContext({latencyHint:'interactive'});live.master=c.createGain();live.master.gain.value=0;live.master.connect(c.destination);live.sfx=c.createGain();live.sfx.gain.value=SFXG();live.sfx.connect(live.master);live.amb=c.createGain();live.amb.gain.value=AMBG();live.amb.connect(live.master)}if(live.ctx.state!=='running')live.ctx.resume().catch(()=>{})}
function audioTick(tt){
 const c=live.ctx;if(!c||!SBUF||c.state!=='running')return;
 live.master.gain.setTargetAtTime(narration.muted?0:1,c.currentTime,.012);
 if(!live.src&&!narration.paused){const s=c.createBufferSource();s.buffer=SBUF.amb;s.loop=true;s.connect(live.amb);s.start();live.src=s;live.next=EVENTS.findIndex(e=>e.t>=tt);if(live.next<0)live.next=EVENTS.length}
 if(tt>=AUDIO_DUR){if(!live.done){live.done=true;live.amb.gain.setTargetAtTime(0,c.currentTime,.6)}return}
 if(narration.paused)return;
 const off=c.currentTime-narration.currentTime;
 if(live.offset===null||Math.abs(off-live.offset)>.25){live.offset=off;live.next=EVENTS.findIndex(e=>e.t>=tt);if(live.next<0)live.next=EVENTS.length}else live.offset=live.offset*.92+off*.08;

}
// 离线渲染:templates/mix_calibrate.py 用,和实时走同一批缓冲区、同一个事件表
window.__renderStems=async(unity=true)=>{
 await audioReady;const len=Math.ceil((AUDIO_DUR+2)*ASR),enc=r=>{const a=r.getChannelData(0),b=r.getChannelData(1),f=new Float32Array(len>>1);for(let i=0;i<f.length;i++)f[i]=(a[2*i]+a[2*i+1]+b[2*i]+b[2*i+1])/4;let bin='';const u=new Uint8Array(f.buffer);for(let i=0;i<u.length;i+=32768)bin+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(bin)};

 return{sr:ASR/2,len:len>>1,sfx:enc(await o1.startRendering()),ambience:enc(await o2.startRendering())};

// window.__extraBoxes 只给阳性对照用:塞一个框进来,__audit 必须报

 const hit=(a,b)=>a.x<b.x+b.w&&b.x<a.x+a.w&&a.y<b.y+b.h&&b.y<a.y+a.h;
 // 同线题允许两个角色略压(scene.char_overlap_max = 占较小那个面积的比例);没写就一律不许压。文字框不在此列
 const OVMAX=CFG.scene&&CFG.scene.char_overlap_max!=null?CFG.scene.char_overlap_max:-1,ovFrac=(a,b)=>Math.max(0,Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x))*Math.max(0,Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y))/Math.min(a.w*a.h,b.w*b.h);
