<style>
:root{--bg:#f4f6f8;--panel:#fff;--ink:#1c2330;--mute:#6b7480;--line:#e3e7ec;--acc:#2563eb;--g:#16803c;--r:#d23b32;--y:#b8860b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,textarea{font:inherit}
button{border:0;border-radius:12px;cursor:pointer;background:#eef1f5;color:var(--ink)}
.top{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top b{font-size:18px}

#preloadSetting[hidden]{display:none}
#preloadToggle{accent-color:var(--acc)}
.card{position:relative}
.preload-badge{position:absolute;top:5px;right:5px;padding:2px 6px;border-radius:6px;background:var(--panel);color:var(--mute);font-size:11px;line-height:1.2;pointer-events:none}
.preload-badge.new-version,#pNewVersion{background:#fff0bd;color:#664600}
#pNewVersion{border-radius:6px;padding:2px 6px;white-space:nowrap;font-size:12px}
#lessonLoading{position:absolute;inset:0;z-index:1;display:grid;place-content:center;justify-items:center;gap:8px;padding:12px;background:#0e1116;color:#fff;text-align:center;overflow:auto}
#lessonLoading[hidden]{display:none}
#lessonSpinner{width:24px;height:24px;border:3px solid #ffffff50;border-top-color:#fff;border-radius:50%;animation:lessonSpin .8s linear infinite}
@keyframes lessonSpin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#lessonSpinner{animation:none}}
#lessonSlow{font-size:13px}
#lessonRetry{min-height:44px;padding:8px 14px}
.card:not(:has(.th)):has(.preload-badge.new-version:not([hidden])){padding-top:24px}
.preload-badge.dot{width:8px;height:8px;padding:0;border-radius:50%;top:8px;right:8px;box-shadow:0 0 0 1.5px #fff}
.preload-badge.dot.loading{background:#f08a24;animation:c51blink 1.6s ease-in-out infinite}
.preload-badge.dot.done{background:#8bd448}
@keyframes c51blink{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.preload-badge.dot.loading{animation:none}}
@media(max-width:560px){.top:has(#preloadSetting:not([hidden])){flex-wrap:wrap}}
.top .sp{flex:1}
.last{outline:3px solid #f5b301;outline-offset:2px}
#whoBtn{min-height:44px;padding:6px 14px;font-weight:700}
.grp{padding:6px 16px 2px;font-size:13px;color:var(--mute);font-weight:700;letter-spacing:.04em}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;padding:8px 16px 24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:92px}
.card.g{box-shadow:inset 5px 0 var(--g)}
.card.r{box-shadow:inset 5px 0 var(--r)}
.card.y{box-shadow:inset 5px 0 var(--y)}
.card .th{width:100%;aspect-ratio:16/9;background:#eef1f5;object-fit:cover;border-radius:9px;border:1px solid var(--line);display:block;margin-bottom:4px}
.card .hd{display:flex;gap:8px;align-items:center}
.card .no{font-weight:800}
.card .st{margin-left:auto;font-size:12px;font-weight:700;border-radius:999px;padding:2px 8px}
.st.g{background:#e5f6ea;color:var(--g)}

.st.y{background:#fff6db;color:var(--y)}

.card .unreplied,.card .fixed-count{min-width:20px;border-radius:999px;background:#b92c27;color:#fff;padding:1px 6px;text-align:center;font-size:12px;font-weight:800}
.card .tt{font-size:15px}
.card .meta{font-size:12px;color:var(--mute)}
.mk{display:inline-block;width:6px;height:6px;border-radius:50%;margin-left:3px;vertical-align:middle}
.card.off{opacity:.55}

#history:has(+ #draftComments[hidden]){max-height:100%}
#history .sh{position:sticky;top:0;background:#12171f}
#historyList{padding:0 12px}
.history-sub{padding:8px 0;border-bottom:1px solid #2a3240;overflow-wrap:anywhere}
.history-sub:last-child{border-bottom:0}
.history-meta{color:#bac3ce;font-size:12px}
.history-entry{margin-top:6px;font-size:14px}
.history-line{display:flex;align-items:flex-start;gap:6px}
.history-line .tm{background:transparent;color:#ffd56a;font-weight:800;padding:0;min-width:48px;min-height:24px}
.history-text,.history-reply{white-space:pre-wrap;overflow-wrap:anywhere}
.history-reply{margin:3px 0 0 54px;color:#d4dce6;font-size:13px}
.history-entry.general .history-reply{margin-left:0}
.history-badge{display:inline-block;border-radius:999px;padding:1px 7px;font-size:12px;font-weight:800}
.history-badge.fixed{background:#d9f4df;color:#145c2e}
.history-badge.nochange,.history-badge.old{background:#e3e8ef;color:#384352}
.history-badge.wip{background:#fff0bd;color:#664600}
.history-badge.unreplied{background:#fce2e1;color:#982a26}
#dock{display:flex;flex-wrap:wrap;gap:6px;padding:6px 8px;background:#171c24;flex:0 0 auto}
#dock button{flex:1 1 90px;min-height:48px;font-weight:800;font-size:15px;color:#fff}
#bNote{background:#d4a017;color:#1a1300}
#bPass{background:var(--g)}
#bTop{background:#ffd56a;color:#1a1300;font-weight:800;font-size:15px;min-height:36px;padding:4px 14px;border-radius:8px;margin-right:12px;flex:0 0 auto}
#dock button.on{outline:3px solid #fff}
.lng{display:flex;gap:4px;flex:0 0 auto}
.lng button{min-height:36px;min-width:44px;padding:4px 8px;font-weight:800;font-size:14px;border-radius:8px}
.lng button.on{background:var(--acc);color:#fff}
#bar .lng button{background:#2a3240;color:#fff}
#bar .lng button.on{background:var(--acc)}
.ov{position:fixed;inset:0;background:rgba(8,10,14,.72);z-index:40;display:none;align-items:center;justify-content:center;padding:12px}
.ov.on{display:flex}
.box{background:#fff;border-radius:16px;width:min(460px,96vw);padding:16px;display:flex;flex-direction:column;gap:10px}
.box p{margin:0;color:var(--mute)}
.box textarea,#nameIn{border:1px solid #c9d0d8;border-radius:10px;padding:10px;min-height:48px;font-size:17px;width:100%}
.box textarea{min-height:96px;resize:vertical}
.row{display:flex;gap:8px}
.row button{flex:1;min-height:48px;font-weight:800}
#cSave,#nameOk{background:var(--acc);color:#fff}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#12351f;color:#fff;border-radius:12px;padding:12px 18px;font-weight:700;display:none;z-index:70;max-width:92vw}
#toast.on{display:block}
.lesson-state{background:#fff0bd;color:#664600;font-size:13px;padding:4px 8px}
</style>

  return url.href;

function paintPreload(entry) {
  if (viewing?.key === entry.key) paintLessonLoading();
  if (!entry.badge) return;
  // t3180 (J 261123):每张卡写明「已存 / 存储中 n% / 未存」,不再只用色点。
  let label = "", tip = "";
  if (preloadUnsupported) {
    tip = T("preloadUnsupported");
    label = entry.newVersion ? T("newVersion") + " · " + tip : tip;
  } else if (entry.newVersion) label = T("newVersion") + (entry.state === "failed" ? " · " + T("preloadFailed") : "");
  else if (entry.state === "cached") { label = T("preloadCached"); tip = label; }
  else if (entry.state === "downloading") {
    label = entry.percent == null ? T("preloadDownloading") : T("preloadPercent")(entry.percent);
    tip = label;
  } else {
    label = T("preloadQueued"); tip = label;
  }
  entry.badge.classList.toggle("new-version", Boolean(entry.newVersion));
  entry.badge.classList.toggle("done", !preloadUnsupported && entry.state === "cached" && !entry.newVersion);
  entry.badge.classList.toggle("loading", !preloadUnsupported && entry.state === "downloading");
  entry.badge.textContent = label;
  if (tip) entry.badge.setAttribute("aria-label", tip); else entry.badge.removeAttribute("aria-label");
  entry.badge.hidden = !label;
}

function paintPreloadSwitch() {
  const toggle = $("preloadToggle");
  toggle.checked = preloadOn && !preloadLow;
  toggle.disabled = preloadLow;
  $("preloadSetting").title = preloadLow ? T("preloadLow") : "";
  $("preloadSetting").hidden = true;
  preloadLessons.forEach(paintPreload);
}

function stopPreload() {
  clearTimeout(preloadTimer);
  preloadTimer = null;
  preloadActive?.aborter.abort();
}

function workerCall(type, entry, { signal, progress, url } = {}) {
  return new Promise((resolve, reject) => {
    const channel = new MessageChannel();
    const cancel = () => channel.port1.postMessage("cancel");
    function finish() {
      clearTimeout(timeout);
      signal?.removeEventListener("abort", cancel);
      channel.port1.close();
    }
    const timeout = setTimeout(() => {
      cancel();
      finish();
      reject(new Error("Preload worker timed out"));
    }, type === "preload" ? 95000 : 10000);
    channel.port1.onmessage = ({ data }) => {
      if ("percent" in data) {
        if (!signal?.aborted) progress?.(data.percent);
        return;
      }
      finish();
      if (data.error) reject(new Error("Preload worker unavailable"));
      else resolve(data);
    };
    signal?.addEventListener("abort", cancel, { once: true });
    try {
      preloadWorker.postMessage({ type, file: entry?.file, sha: entry?.sha, url, mode: entry?.mode }, [channel.port2]);
      if (signal?.aborted) cancel();
    } catch (error) {
      finish();
      reject(error);
    }
  });
}

// t3180: covers finish before any lesson is fetched. One lesson at a time, top to
// bottom; the lesson the reviewer opened is pulled to the front and the transfer
// already on the wire is aborted so it gives up the bandwidth.
function coversSettled() {
  return thumbQueue.length === 0 && thumbInflight === 0 && thumbsDone;
}
function schedulePreload() {
  if (!preloadWorker || preloadUnsupported || !preloadOn || preloadLow || preloadTimer || preloadActive || preloadOpening) return;
  if (!coversSettled()) return;
  const now = Date.now();
  const queued = preloadOrder.filter(item => item.state === "queued");
  const ready = queued.filter(item => !item.retryAt || item.retryAt <= now);
  const front = ready.find(item => item.rush);
  const entry = front || ready.find(item => item.newVersion) || ready[0];
  const next = entry ? (front ? 0 : preloadStart) : Math.min(...queued.map(item => item.retryAt));
  if (!Number.isFinite(next)) return;
  preloadTimer = setTimeout(() => {
    preloadTimer = null;
    if (entry) downloadLesson(entry);
    else schedulePreload();
  }, Math.max(0, next - now));
}

// Media named inside a lesson follows that lesson's HTML, still one at a time.
async function cacheLessonMedia(entry, signal) {
  let html = "";
  try {
    const response = await fetch(entry.key, { cache: "force-cache" });
    if (response.ok) html = await response.text();
  } catch { return; }
  const found = [...html.matchAll(/(?:src|href)="([^"]+\.(?:mp4|webm|m4a|mp3|wav|ogg))(?:\?c51-sha=([a-f0-9]{64}))?"/g)];
  for (const [, raw, named] of found) {
    if (signal.aborted) return;
    let target;
    try { target = new URL(raw, new URL(entry.file, new URL("./", location.href))); } catch { continue; }
    if (target.origin !== location.origin) continue;
    const sha = named || target.searchParams.get("c51-sha");
    if (!/^[a-f0-9]{64}$/.test(sha)) continue;
    await workerCall("asset", { sha }, { signal, url: target.href }).catch(() => {});
  }
}

async function downloadLesson(entry) {
  const aborter = new AbortController();
  preloadActive = { entry, aborter };
  entry.state = "downloading";
  entry.percent = null;
  paintPreload(entry);
  try {
    const result = await workerCall("preload", entry, {
      signal: aborter.signal,
      progress: percent => {
        entry.percent = percent;
        paintPreload(entry);
      }
    }).catch(() => ({}));
    if (result.cached) {
      entry.state = "cached";
      entry.retryAt = 0;
      entry.failures = 0;
      entry.rush = false;
      await cacheLessonMedia(entry, aborter.signal);
      if (viewing?.key === entry.key && viewing.failed &&
          preloadLessons.get(entry.file) === entry) setLessonFrame(curLesson());
    } else if (result.lowStorage) {
      preloadLow = true;
      paintPreloadSwitch();
    } else if (!aborter.signal.aborted) {
      entry.failures = (entry.failures || 0) + 1;
      if (entry.failures === 3) entry.state = "failed";
      else entry.retryAt = Date.now() + entry.failures * 1500;
    }
  } finally {
    if (entry.state === "downloading") entry.state = "queued";
    preloadActive = null;
    paintPreload(entry);
    schedulePreload();
  }
}

function paintLessonLoading() {
  const loading = viewing && !viewing.ready;
  const entry = loading ? preloadLessons.get(curLesson().file) : null;
  const cachedGrace = loading && viewing.deferOverlay && !viewing.failed &&
    viewing.percent === undefined && entry?.key === viewing.key && entry?.state === "cached";
  $("lessonLoading").hidden = !loading || cachedGrace;
  $("lesson").inert = Boolean(loading);
  $("lessonSlow").hidden = !loading || !viewing.slow;
  $("lessonRetry").hidden = !loading || !(viewing.failed || viewing.slow);
  $("lessonRetry").disabled = Boolean(viewing?.retrying);
  if (!loading) return;
  const backgroundPercent = viewing.key === entry?.key && entry?.state === "downloading" ? entry.percent : null;
  const percent = viewing.percent === undefined ? backgroundPercent : viewing.percent;
  const label = T("lessonLoading");
  if ($("lessonLoadText").textContent !== label) $("lessonLoadText").textContent = label;
  const percentLabel = $("lessonLoadPercent");
  percentLabel.hidden = viewing.failed || !Number.isFinite(percent);

function setLessonFrame(lesson) {

      clearTimeout(preloadTimer);
      preloadTimer = null;
      for (const other of preloadOrder) if (other !== entry) other.rush = false;
      entry.rush = true;
      entry.retryAt = 0;
      preloadOpening = { entry };
      if (preloadActive && preloadActive.entry !== entry) preloadActive.aborter.abort();
      else workerCall("yield").catch(() => {});

function lessonFrameLoaded() {

async function refreshOpenedLesson(opening) {
  if (opening.refreshing) return;
  opening.refreshing = true;

  if (result.cached) {

    if (result.cached) {
      for (const other of preloadOrder) {

function waitForPreloadWorker(serviceWorker, script) {
  return new Promise(resolve => {
    const check = () => {
      if (serviceWorker.controller?.scriptURL === script) finish(serviceWorker.controller);
    };
    const finish = worker => {
      clearTimeout(timeout);
      serviceWorker.removeEventListener("controllerchange", check);
      resolve(worker);
    };
    const timeout = setTimeout(() => finish(null), 5000);
    serviceWorker.addEventListener("controllerchange", check);
    check();
  });
}

async function initPreload() {
  // J 261123: once saved, the buffer stays. Ask the browser not to evict it.
  try { navigator.storage?.persist?.().catch(() => {}); } catch {}
  if (!serviceWorker) return;
  const script = new URL(new URLSearchParams(location.search).get("sw") || "sw.js", new URL("./", location.href)).href;
  try {
    const registration = await serviceWorker.register(script, { scope: "./", updateViaCache: "none" });
    if (registration) preloadWorker = await waitForPreloadWorker(serviceWorker, script);
    serviceWorker.addEventListener("controllerchange", async () => {
      const controller = serviceWorker.controller;
      if (controller?.scriptURL !== script || controller === preloadWorker) return;
      preloadWorker = controller;
      stopPreload();
      await manifestRefresh;
      if (DATA) refreshManifest();
    });
    const { quota, usage } = await navigator.storage.estimate();
    preloadLow = Number.isFinite(quota) && Number.isFinite(usage) && quota - usage < 2 * 1024 ** 3;
  } catch {}
  preloadUnsupported = !preloadWorker;
  preloadLessons.forEach(paintPreload);
}

function refreshManifest() {
  if (manifestRefresh) return manifestRefresh;
  manifestRefresh = (async () => {
    let manifest, keys;
    if (preloadWorker) {
      const sync = await workerCall("sync").catch(() => ({}));
      ({ manifest, keys } = sync);
      const unsupported = sync.offlineSupported === false;
      if (sync.offlineSupported !== undefined && preloadUnsupported !== unsupported) {
        preloadUnsupported = unsupported;
        if (preloadUnsupported) stopPreload();
        preloadLessons.forEach(paintPreload);
      }
    }
    if (!manifest) {
      const url = new URL("manifest.json", location.href);
      if (url.hostname === "review.ooii.top" && globalThis.crypto?.getRandomValues) {
        const nonce = crypto.getRandomValues(new Uint8Array(32));
        url.searchParams.set("c51-sha", Array.from(nonce, b => b.toString(16).padStart(2, "0")).join(""));
      }
      const aborter = new AbortController();
      const timeout = setTimeout(() => aborter.abort(), 10000);
      try {
        const response = await fetch(url, {
          cache: "no-store", redirect: "error", signal: aborter.signal
        });
        if (!response.ok) throw new Error("Manifest unavailable");
        manifest = await response.json();
      } finally {
        clearTimeout(timeout);
      }
    }
    if (!Array.isArray(manifest.items)) throw new Error("Invalid manifest");
    applyManifest(manifest, keys && new Set(keys));
  })().then(()=>clearLoadError("manifest"),()=>showLoadError("manifest",refreshManifest)).finally(() => { manifestRefresh = null; });
  return manifestRefresh;
}

function applyManifest(manifest, cached) {
  const base = new URL("./", location.href);
  const root = new URL("lessons/", base).pathname;
  const next = new Map();
  const shas = {};
  let changed = false, prioritize = false;
  for (const item of manifest.items) {
    if (typeof item?.file !== "string" || !/^[a-f0-9]{64}$/.test(item.sha)) continue;
    const key = preloadURL(item.file, item.sha);
    const url = new URL(key);
    if (url.origin !== base.origin || !url.pathname.startsWith(root) ||
        !/^[^/]+\.html$/.test(url.pathname.slice(root.length))) continue;
    const previous = preloadLessons.get(item.file);
    const hit = cached?.has(key);
    let entry = previous;
    if (previous?.key !== key) {
      entry = { file: item.file, sha: item.sha, key,
        state: hit ? "cached" : "queued", newVersion: Boolean(previous) };
      changed = true;
      prioritize ||= Boolean(previous) && !hit;
    } else if (hit || (cached && entry.state === "cached")) {
      entry.state = hit ? "cached" : "queued";
      paintPreload(entry);
    }
    next.set(item.file, entry);
    shas[item.id] = item.sha;
  }
  changed ||= !manifestReady || next.size !== preloadLessons.size;
  manifestReady = true;
  if (prioritize || (preloadActive && next.get(preloadActive.entry.file) !== preloadActive.entry)) {
    stopPreload();
    preloadStart = Math.max(preloadStart, Date.now() + 10000);
  }
  if (changed) {
    preloadLessons.clear();
    next.forEach((entry, file) => preloadLessons.set(file, entry));
    SHA = shas;
    loadReviewStatus();
    renderHome();
    updatePreloadOrder();
    if (viewing && !viewing.pending) {
      const latest = preloadLessons.get(curLesson().file);
      $("pNewVersion").hidden = !latest || latest.key === viewing.key;
    }
  }
  schedulePreload();
}

function hideLessonBgm(frame) {
  let doc, win;
  try { doc = frame.contentDocument; win = frame.contentWindow; } catch { return; }
  if (!doc || !doc.documentElement) return;
  const paint = () => {
    if (!doc.head || doc.getElementById("c51-hide-bgm")) return;

    style.textContent = '[data-cv-ctl="bgm"],#bgmToggle,#bgmBtn,#music{display:none!important}';
    doc.head.appendChild(style);
  };
  paint();
  // Lessons rebuild the control bar on language switch. Re-hide without touching lessons.
  if (!doc.documentElement.dataset.c51BgmWatch) {
    doc.documentElement.dataset.c51BgmWatch = "1";
    new MutationObserver(paint).observe(doc.documentElement, { childList: true, subtree: true });
  }
  try { if (typeof win.setBgm === "function") win.setBgm(false); } catch {}
  try {
    const btn = doc.querySelector('[data-cv-ctl="bgm"]');
    if (btn && btn.getAttribute("aria-pressed") === "true") btn.click();
  } catch {}
  try {
    for (const audio of doc.querySelectorAll("audio#bgm")) {
      audio.muted = true;
      if (!audio.paused) audio.pause();
    }
  } catch {}
}

// Issue covers in catalogue order, four at a time. A worker can cache the
// request transparently, but the page always gives the URL directly to the image.
const thumbQueue=[];
let thumbInflight=0, thumbsDone=false;
const thumbSlots=4;
function pumpThumbs(){
  while(thumbInflight<thumbSlots && thumbQueue.length){
    const img=thumbQueue.shift();
    if(!img.isConnected) continue;
    thumbInflight++;
    const src=img.dataset.src;
    const key="thumb:"+src;
    const needsWarmup=serviceWorker && !serviceWorker.controller;
    function settled(){
      img.onload=img.onerror=null;
      thumbInflight--;
      pumpThumbs();
    }
    img.onload=()=>{
      clearLoadError(key);
      settled();
      if (!needsWarmup) return;
      // First visits can paint before the worker claims the page. Save those
      // covers after the image loads so a later controlled visit can reuse them.
      const [file, sha]=src.split("?c51-sha=");
      if (!/^[a-f0-9]{64}$/.test(sha)) return;
      preloadInit.then(()=>{
        if(preloadWorker && !preloadUnsupported) workerCall("thumb", {file,sha}).catch(()=>{});
      });
    };
    img.onerror=()=>{
      if(img.isConnected) showLoadError(key,()=>{
        if(!img.isConnected || !img.hasAttribute("src")) return;
        img.removeAttribute("src");
        thumbsDone=false;
        thumbQueue.push(img);
        pumpThumbs();
      });
      settled();
    };
    img.src=src;
  }
  if(!thumbQueue.length && !thumbInflight){
    thumbsDone=true;
    schedulePreload();
  }
}

function placeLandscapeControls(on){

  if(on){
    if(btn.parentNode!==rail){rail.append(btn,dock);pb.append($("cmtOv"),$("nameOv"))}

function syncRotation(){
  const active=rotationPlayer.classList.contains("on")&&!rotationOptOut;
  const useCss=active&&phonePortrait.matches;
  const native=active&&!useCss&&rotationLock?.locked&&document.fullscreenElement===rotationPlayer;
  rotationPlayer.classList.toggle("c51-native-landscape",Boolean(native));
  rotationPlayer.classList.toggle("c51-css-landscape",useCss);
  // A failed transform restores the review layout and leaves the existing dialog as a fallback.
  const cssWorked=useCss&&getComputedStyle($("pbody")).transform!=="none";
  if(useCss&&!cssWorked)rotationPlayer.classList.remove("c51-css-landscape");
  placeLandscapeControls(rotationPlayer.classList.contains("c51-css-landscape")||Boolean(native));
  const show=useCss&&!cssWorked&&!rotationDismissed&&!rotationLock;
  if(show&&!rotatePrompt.open)rotatePrompt.showModal();
  if(!show&&rotatePrompt.open)rotatePrompt.close();
}

function endNativeRotation(request){
  request.cancelled=true;
  if(document.fullscreenElement!==rotationPlayer)return;
  screen.orientation?.unlock?.();
  document.exitFullscreen?.().catch(()=>{});
}
async function lockLandscape(request){
  try{
    await rotationPlayer.requestFullscreen();
    if(request.cancelled||document.fullscreenElement!==rotationPlayer)return;
    await screen.orientation.lock("landscape");
    // Some hosts resolve lock() without resizing the viewport. Keep CSS active until it actually turns.
    if(phonePortrait.matches&&!request.cancelled)await new Promise(resolve=>setTimeout(resolve,250));
    request.locked=!request.cancelled&&!phonePortrait.matches&&document.fullscreenElement===rotationPlayer;
  }catch{
    // WebViews can reject either fullscreen or orientation lock. CSS stays available.
  }finally{
    if(!request.locked){
      endNativeRotation(request);
      rotationLock=null;
    }
    syncRotation();
  }
}
function startLandscape(){
  if(!phonePortrait.matches)return;
  rotationOptOut=false;
  if(!rotationLock&&!document.fullscreenElement&&document.fullscreenEnabled&&screen.orientation?.lock){
    rotationLock={cancelled:false,locked:false};
    void lockLandscape(rotationLock);
  }
  syncRotation();
}
function stopNativeRotation(){
  if(!rotationLock)return;
  endNativeRotation(rotationLock);
  if(rotationLock.locked)rotationLock=null;
}
function showPortrait(){
  rotationOptOut=true;
  stopNativeRotation();
  syncRotation();
}

function renderList(){
  const l=curLesson();const box=$("clist");if(!l){box.innerHTML="";return}

  for(const record of queueGet()){
    if(record.lesson!==lid(l)||record.sha!==sha||!record.comment_id)continue;
    if(record.comment_action==="delete")pending.delete(record.comment_id);
    else pending.set(record.comment_id,{...record.comments[0],id:record.comment_id,sha});
  }
  const drafts=comments(l,sha);
  const cs=[...drafts,...pending.values()].sort((a,b)=>a.s-b.s);

async function saveFollowup(draft,text){
  const {account,...target}=draft;
  const saveButton=$("cSave");
  saveButton.disabled=true;
  try{
    const res=await fetch("/followup",{method:"POST",headers:{"Content-Type":"application/json","X-C51-Account":account},
      body:JSON.stringify({...target,text}),signal:AbortSignal.timeout(8000)});
    if(account!==accountKey)return;
    if(res.status===409){
      if(followupDraft===draft)toast(T("followupStale"));
      if(viewing)await loadHistory(curLesson());
      return;
    }
    if(!res.ok||!(await res.json()).ok)throw new Error("Could not send follow-up");
    if(followupDraft===draft){resumeAfter=false;closeComment()}
    await Promise.all([loadReviewStatus(),loadSummary(),viewing&&loadHistory(curLesson())]);
    toast(T("sent"));
  }catch{
    if(followupDraft===draft)toast(T("followupError"));
  }finally{
    if(followupDraft===draft)saveButton.disabled=false;
  }
}
function saveComment(){
  const text=$("txt").value.trim();if(!text){$("txt").focus();return}
  if(followupDraft){if(!$("cSave").disabled)saveFollowup(followupDraft,text);return}
  const l=curLesson();if(!l)return;
  const it=editingComment;
  const cid=it?.id??crypto.randomUUID();
  const payload=[{s:it?.s??Math.round(pendingS*10)/10,c:text,lang:it?.lang||LANG}];
  if(!submitChange(l,it?.sha??viewedSha(l),"y",payload,it?.id?"edit":"create",cid))return;
  if(it&&!it.id)discardDraft(l,it);
  $("cmtOv").classList.remove("on");resumeAfter=false;
}

function reviewRecord(lesson,sha,verdict,comments){
  return {v:1,page:PAGE_ID,lesson,sha,verdict,comments,
    ts:new Date().toISOString(),ua:navigator.userAgent.slice(0,120),
    request_id:crypto.randomUUID(),account_key:accountKey};
}
function submitChange(l,sha,verdict,payload,action,id){
  if(!accountKey)return false;
  if(!sha){toast(T("noSha"));return false}
  if(JSON.stringify(payload).length>20000){toast(T("tooLarge"));return false}
  const rec=reviewRecord(lid(l),sha,verdict,payload);
  if(action)Object.assign(rec,{comment_action:action,comment_id:id});
  try{queueSet([...queueGet(),rec])}catch{toast(T("roleSaveError"));return false}
  paintReviewActions();renderList();renderHistory(l);
  flushQueue().then(ok=>{if(!ok)toast(T("offline"))});
  return true;
}
const RESOLVED_STATES=["fixed","nochange","merged","conflict"];
const HISTORY_STATES=["pending","queued","fixed","nochange","wip","merged","conflict"];
let summary={}, summaryRequest=0, historyView=null;

async function loadReviewStatus(){
  if(!accountKey||!DATA)return;
  const request=++statusRequest;
  const entries=Object.entries(SHA).filter(([id])=>id&&id.length<=64);
  const chunks=[];
  for(let i=0;i<entries.length;i+=50)chunks.push(entries.slice(i,i+50));
  if(!chunks.length)chunks.push([]);
  const parts=await Promise.all(chunks.map(async (chunk,index)=>{
    const params=new URLSearchParams({shas:JSON.stringify(Object.fromEntries(chunk))});
    const data=await getReviewData("/status?"+params);
    if(!data?.lessons)return null;
    if(index===0)return data.lessons;
    return Object.fromEntries(chunk.map(([id])=>[id,data.lessons[id]]));
  }));
  if(request!==statusRequest)return;
  if(parts.some(part=>!part)){showLoadError("status",loadReviewStatus);return;}
  clearLoadError("status");
  const next=Object.assign(Object.create(null),...parts);
  const unchanged=statusReady&&JSON.stringify(next)===JSON.stringify(lessonStatus);
  statusReady=true;
  lessonStatus=next;
  queueLegacyPasses();
  if(unchanged){
    if(viewing)paintReviewActions();
    return;
  }
  const focused=document.activeElement?.dataset.lid;
  renderHome();
  if(focused)document.querySelector('[data-lid="'+CSS.escape(focused)+'"]')?.focus({preventScroll:true});
  if(viewing){paintFixBanner($("pFix"),curLesson());paintReviewActions()}
}

async function getReviewData(path){
  if(!accountKey)return null;
  try{
    const controller=new AbortController();
    const timeout=setTimeout(()=>controller.abort(),5000);
    try{
      const response=await fetch(path,{signal:controller.signal,cache:"no-store",
        headers:{"X-C51-Account":accountKey}});
      if(!response.ok)return null;
      const data=await response.json();
      return data?.ok===true?data:null;
    }finally{clearTimeout(timeout)}
  }catch(e){return null}
}

async function loadHistory(l){
  const id=lid(l);
  const previous=historyView?.id===id?historyView:null;
  const view={id,items:previous?.items??[]};
  historyView=view;
  if(!previous)renderHistory(l);
  const data=await getReviewData("/history?lesson="+encodeURIComponent(id));
  if(historyView!==view||!Array.isArray(data?.items)||
      JSON.stringify(data.items)===JSON.stringify(view.items))return;
  view.items=data.items;
  renderList();renderHistory(l);

const reviewText=value=>typeof value==="string"?value:"";
const lastReply=replies=>Array.isArray(replies)?replies[replies.length-1]:null;
function reviewDate(value){
  const date=new Date(reviewText(value));
  return Number.isFinite(date.getTime())
    ?date.toLocaleDateString("sv-SE",{timeZone:"Asia/Shanghai"}):"";
}

function replyDetails(reply){
  if(reply?.status==="conflict")return [T("conflictWith")(reviewText(reply.with)),reviewText(reply.text)];
  const batch=reviewText(reply?.batch), version=reviewText(reply?.version);
  if(reply?.status==="queued")return [batch?T("queuedBy")(batch):T("fixing")];
  if(reply?.status==="wip")return [batch?T("batchLabel")(batch):version,reviewText(reply.text)];
  if(reply?.status==="merged")return [
    reply.target_sub_id!=null?T("mergedInto")(reply.target_sub_id,reply.target_idx):"",reviewText(reply.text)];
  return [reviewText(reply?.text),reply?.status==="fixed"&&version?T("fixedIn")(version):version];
}
function appendHistoryReply(entry,reply,effective){
  const status=HISTORY_STATES.includes(reply?.status)?reply.status:"pending";
  const row=document.createElement("div");
  row.className="history-reply";
  row.innerHTML='<span class="history-badge cmt-state"></span> <span class="history-answer"></span>';
  const badge=row.firstElementChild;
  badge.classList.add(status);
  badge.textContent=T(status);
  row.lastElementChild.textContent=[...replyDetails(reply),...(effective?[T(effective.status),...replyDetails(effective)]:[])].filter(Boolean).join(" · ");
  entry.appendChild(row);
}
function appendHistoryEntry(group,text,seconds,replies,effective,comment=null){
  const latest=lastReply(replies);
  const entry=document.createElement("div");
  const timed=Number.isFinite(seconds)&&seconds>=0;
  entry.className="history-entry"+(timed?"":" general");
  entry.innerHTML='<div class="history-line"><span class="history-text"></span></div>';
  if(timed){
    const time=document.createElement("button");
    time.type="button";
    time.className="tm";
    time.textContent="["+fmt(seconds)+"]";
    time.onclick=()=>{seek(seconds);pause()};
    entry.firstElementChild.prepend(time);
  }
  entry.querySelector(".history-text").textContent=text;
  const followups=new Map((comment?.followups??[]).map(followup=>[followup.reply_id,followup]));
  const status=comment?.status??latest?.status??"pending";
  const currentReply=latest?.status===status?latest:{status,batch:comment?.batch};
  const timeline=comment?(replies??[]):[];
  for(const reply of timeline){
    if(reply!==currentReply&&reply.by==="system"&&!RESOLVED_STATES.includes(reply.status))continue;
    appendHistoryReply(entry,reply,reply===currentReply?effective:null);
    const followup=followups.get(reply.id);
    if(followup){
      const row=document.createElement("div");
      row.className="history-reply history-followup";
      const date=new Date(followup.at).toLocaleString(LANG,{timeZone:"Asia/Shanghai"});
      row.title=T("beijing");
      row.textContent=[T("followup"),followup.author,date,followup.sha].join(" · ")+"\n"+followup.text;
      entry.appendChild(row);
    }
  }
  if(!comment||currentReply!==latest)appendHistoryReply(entry,currentReply,effective);
  group.appendChild(entry);
  return entry;
}

function renderHistory(l){
  const list=$("historyList");
  list.replaceChildren();
  const id=lid(l), currentSha=viewedSha(l);
  const pending=new Set(queueGet().filter(record=>record.lesson===id).map(record=>record.comment_id));
  for(const item of historyView?.items||[]){
    if(!item||typeof item!=="object")continue;
    const cs=Array.isArray(item.comments)?item.comments.filter(c=>reviewText(c?.c).trim()):[];
    const note=reviewText(item.note).trim();
    // The submission form also sends an auto-generated copy of its timed comments.
    const mark={g:"🟩",r:"🟥",y:"🟨"}[reviewText(item.verdict)];
    const generated=[id+" "+mark,...cs.map(c=>"["+fmt(Number.isFinite(c.s)?c.s:0)+"] "+c.c)].join("\n");
    const showNote=lastReply(item.note_replies)||(note&&note!==generated);
    const visible=cs.filter(comment=>!pending.has(comment.id));
    if(!visible.length&&!showNote)continue;
    const group=document.createElement("div");
    group.className="history-sub";
    const meta=document.createElement("div");
    meta.className="history-meta";
    meta.textContent=[reviewText(item.reviewer),reviewDate(item.received_at)].filter(Boolean).join(" · ");
    meta.title=T("beijing");
    const itemSha=reviewText(item.sha);
    if(currentSha&&itemSha&&itemSha!==(itemSha.length===8?currentSha.slice(0,8):currentSha)){
      const old=document.createElement("span");
      old.className="history-badge old";
      old.textContent=T("oldVersion");
      meta.append(" · ",old);
    }
    group.appendChild(meta);
    if(showNote)appendHistoryEntry(group,note===generated?note.split("\n")[0]:note,null,item.note_replies,item.note_effective_reply);
    for(const comment of visible){
      const entry=appendHistoryEntry(group,comment.c,comment.s,comment.replies,comment.effective_reply,comment);
      const reply=lastReply(comment.replies);
      if(item.own&&reply?.id&&RESOLVED_STATES.includes(comment.status)){
        const button=document.createElement("button");
        button.type="button";
        button.className="comment-edit history-followup-button";
        button.textContent=T("followupButton");
        entry.lastElementChild.append(" ",button);
        button.onclick=()=>openFollowup(l,reply);
      }
      if(item.own&&comment.id&&/^(?:[a-f0-9]{8}|[a-f0-9]{64})$/.test(itemSha)){
        const it={...comment,sha:itemSha};
        addCommentActions(entry.querySelector(".history-line"),it,()=>removeComment(it));
      }
    }
    list.appendChild(group);
  }
  $("history").hidden=!list.childElementCount;
}

const queueKey=()=>KEY+":queue:"+accountKey;
function queueGet(){
  try{return accountKey?JSON.parse(localStorage.getItem(queueKey())||"[]"):[]}catch{return []}
}
function queueSet(q){localStorage.setItem(queueKey(),JSON.stringify(q))}
function legacyDraft(key){
  const draft=readDraft(key);
  return draft?.v&&(draft.name==null||draft.name===""||draft.name===FEISHU_NAME)?draft:null;
}

// Prefer the account draft and exact lesson IDs when old keys overlap.
function queueLegacyPasses(){
  if(!accountKey||!FEISHU_NAME||!statusReady||!manifestReady)return;
  const sources=[draftKey(),KEY].map(key=>[key,legacyDraft(key)]).filter(([,draft])=>draft);
  if(!sources.length)return;
  const lessons=new Map(DATA.lessons.filter(l=>lid(l)).map(l=>[lid(l),l]));
  const queue=queueGet();
  const pending=new Set(queue.map(record=>record.lesson));
  const candidates=[];
  for(const [key,draft] of sources){
    for(const [id,record] of Object.entries(draft.v)){
      if(record?.v!=="g"||record.migrated||typeof record.sha!=="string"||
          !/^(?:[a-f0-9]{8}|[a-f0-9]{64})$/.test(record.sha))continue;
      const lesson=lessons.get(id)??lessons.get(id+"-c");
      if(!lesson||mine(lesson)!=="unreviewed")continue;
      candidates.push({key,id,lesson:lid(lesson),sha:record.sha});
    }
  }
  candidates.sort((a,b)=>Number(a.id!==a.lesson)-Number(b.id!==b.lesson));
  const added=[];
  for(const {key,id,lesson,sha} of candidates){
    if(pending.has(lesson))continue;
    pending.add(lesson);
    added.push({...reviewRecord(lesson,sha,"g",[]),only_unreviewed:true,legacy:{key,id}});
  }
  if(!added.length)return;
  try{queueSet([...queue,...added])}catch{return}
  flushQueue();
}

function pendingLegacyDraft(record){
  const {key,id}=record.legacy;
  const draft=legacyDraft(key);
  const old=draft?.v?.[id];
  return old?.v==="g"&&old.sha===record.sha&&!old.migrated?draft:null;
}

function markLegacyPass(record){
  const draft=pendingLegacyDraft(record);
  if(!draft)return false;
  const {key,id}=record.legacy;
  draft.v[id].migrated=true;
  localStorage.setItem(key,JSON.stringify(draft));
  return true;
}

const legacyPassNotice={
  zh:n=>"已补回 "+n+" 条以前的通过",
  en:n=>"Restored "+n+" previous "+(n===1?"approval":"approvals"),
  ru:n=>"Восстановлено прежних одобрений: "+n,
  kk:n=>"Қалпына келтірілген бұрынғы мақұлдаулар: "+n
};
let queueFlush, legacyPassesRestored=0;
function flushQueue(){
  if(!accountKey||reviewerRole===null)return Promise.resolve(false);
  if(queueFlush)return queueFlush;
  const account=accountKey;
  queueFlush=(async ()=>{
    let sent=false, manualSent=false, blocked=false;
    try{
      while(accountKey===account){
        const [record]=queueGet();
        if(!record)break;
        const {legacy,...payload}=record;
        if(legacy&&!pendingLegacyDraft(record)){
          queueSet(queueGet().filter(item=>item.request_id!==record.request_id));
          continue;
        }
        const res=await fetch("/submit",{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify(payload),signal:AbortSignal.timeout(8000)});
        if(!res.ok)return false;
        const result=await res.json();
        if(!result.ok||accountKey!==account)return false;
        if(legacy&&!result.skipped&&!result.blocked&&markLegacyPass(record))legacyPassesRestored++;
        manualSent ||= !legacy;
        blocked ||= result.blocked===true;
        queueSet(queueGet().filter(item=>item.request_id!==record.request_id));
        sent=true;
      }
      return accountKey===account;
    }catch{return false}
    finally{
      if(sent&&accountKey===account){
        await Promise.all([loadReviewStatus(),loadSummary(),viewing&&loadHistory(curLesson())]);
        if(viewing){renderList();renderHistory(curLesson())}
        const remaining=queueGet();
        if(legacyPassesRestored&&!remaining.some(item=>item.legacy)){
          toast(legacyPassNotice[LANG](legacyPassesRestored));
          legacyPassesRestored=0;
        }else if(manualSent&&!remaining.length)toast(T(blocked?"passBlocked":"sent"));
      }
    }
  })().then(ok=>{
    queueFlush=null;
    return ok&&accountKey&&queueGet().length?flushQueue():ok;
  },()=>{
    queueFlush=null;
    return false;
  });
  return queueFlush;
}
setInterval(()=>{if(queueGet().length)flushQueue()},30000);
window.addEventListener("online",()=>{flushQueue();refreshReview()});

    renderHistory(lesson);
  }
};

function setRoleMenu(open){
  $("whoMenu").hidden=!open;
  $("whoBtn").setAttribute("aria-expanded",String(open));
  if(open)$("switchRole").focus();
}

function paintRoleError(){
  $("roleError").textContent=roleError?T(roleError):"";
}

function openRoleDialog(){
  roleError="";paintRoleError();
  $("roleRetry").hidden=true;
  for(const button of $("roleOptions").querySelectorAll("button")){
    button.disabled=!FEISHU_NAME;
    button.setAttribute("aria-pressed",String(button.dataset.role===reviewerRole));
  }
  if(!$("roleDialog").open)$("roleDialog").showModal();
}

function paintReviewer(){
  const button=$("whoBtn");
  button.textContent="";
  if(FEISHU_NAME&&reviewerAvatar){
    const img=document.createElement("img");
    img.src=reviewerAvatar;img.alt="";img.referrerPolicy="no-referrer";
    img.style.cssText="width:28px;height:28px;border-radius:50%;vertical-align:middle;margin-right:8px;object-fit:cover";
    img.onerror=()=>img.remove();
    button.appendChild(img);
  }
  button.append(document.createTextNode(FEISHU_NAME));
}

let reviewerAvatar="";
async function loadReviewer(){
  $("roleRetry").disabled=true;
  try{
    const response=await fetch("/auth/me",{cache:"no-store",signal:AbortSignal.timeout(8000)});
    if(response.status===401){
      location.replace("/auth/login?"+new URLSearchParams({next:location.pathname+location.search}));
      return;
    }
    if(!response.ok)throw new Error("Could not load reviewer");
    const profile=await response.json();
    if(!profile.ok||!profile.name||!profile.account_key)throw new Error("Invalid reviewer profile");
    if(accountKey!==profile.account_key){
      accountKey=profile.account_key;
      legacyPassesRestored=0;
      lessonStatus={};statusReady=false;summary={};historyView=null;
      ++statusRequest;++summaryRequest;
      st=loadDraft();
    }
    clearLoadError("login");
    FEISHU_NAME=profile.name;reviewerAvatar=profile.avatar;
    st.name=profile.name;save();
    reviewerRole=["kk_ru","kk","ru","zh","none"].includes(profile.role)?profile.role:null;
    reviewerAdmin=profile.is_admin===true;
    paintReviewer();
    if(reviewerRole===null)openRoleDialog();
    else{
      $("roleDialog").close();
      updateRoleView();
      loadReviewStatus();
      loadSummary();
      flushQueue();
    }
  }catch{
    showLoadError("login",loadReviewer);
  }finally{
    $("roleRetry").disabled=false;
  }
}

function updateRoleView(){
  if(!DATA)return;
  stopPreload();
  renderHome();
  updatePreloadOrder();
  schedulePreload();
}

async function chooseRole(role){
  if(roleSaving||!FEISHU_NAME)return;
  roleSaving=true;
  const buttons=[...$("roleOptions").querySelectorAll("button")];
  buttons.forEach(button=>button.disabled=true);
  roleError="";paintRoleError();
  try{
    const response=await fetch("/me/role",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({role}),signal:AbortSignal.timeout(8000)});
    if(response.status===401){await loadReviewer();return}
    if(!response.ok||(await response.json()).role!==role)throw new Error("Could not save role");
    reviewerRole=role;
    $("roleDialog").close();
    $("whoBtn").focus();
    updateRoleView();
    flushQueue();
  }catch{
    roleError="roleSaveError";paintRoleError();
  }finally{
    roleSaving=false;
    buttons.forEach(button=>button.disabled=!FEISHU_NAME);
    if($("roleDialog").open&&FEISHU_NAME)buttons.find(button=>button.dataset.role===role)?.focus();
  }
}

const loadErrors=new Map();
const noticeMessages={zh:["部分内容加载失败，请重试。","重试"],en:["Some content could not be loaded. Please retry.","Retry"],ru:["Не удалось загрузить часть данных. Повторите попытку.","Повторить"],kk:["Кейбір деректер жүктелмеді. Қайталап көріңіз.","Қайталау"]};
function paintLoadError(){
  const banner=$("loadNotice"), words=noticeMessages[document.documentElement.lang]||noticeMessages.zh;
  banner.hidden=!loadErrors.size; $("loadNoticeText").textContent=words[0]; $("loadRetry").textContent=words[1];
}
function showLoadError(key,retry){loadErrors.set(key,retry);paintLoadError()}
function clearLoadError(key){loadErrors.delete(key);paintLoadError()}
$("loadRetry").onclick=()=>{for(const retry of [...loadErrors.values()])retry()};
async function loadCatalog(){
  try{
    const r=await fetch("lessons.json",{cache:"no-cache"});
    if(!r.ok)throw new Error("Catalog unavailable");
    const d=await r.json(); if(!Array.isArray(d.lessons))throw new Error("Invalid catalog");
    DATA=d; clearLoadError("catalog"); renderHome();
    loadSummary(); loadReviewStatus();
    // Covers go first; lessons start the moment the last cover settles.
    preloadStart=0;
    preloadInit.then(refreshManifest);
  }catch{showLoadError("catalog",loadCatalog)}
}
preloadInit=initPreload();
if(AUTH_SITE)loadReviewer();
loadCatalog();
