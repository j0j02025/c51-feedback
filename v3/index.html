<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>看课评审</title>
<style>
:root{--bg:#f4f6f8;--panel:#fff;--ink:#1c2330;--mute:#6b7480;--line:#e3e7ec;--acc:#2563eb;--g:#16803c;--r:#d23b32;--y:#b8860b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,textarea{font:inherit}
button{border:0;border-radius:12px;cursor:pointer;background:#eef1f5;color:var(--ink)}
.top{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top b{font-size:18px}
.top .sp{flex:1}
#whoBtn{min-height:44px;padding:6px 14px;font-weight:700}
.grp{padding:6px 16px 2px;font-size:13px;color:var(--mute);font-weight:700;letter-spacing:.04em}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;padding:8px 16px 24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:92px}
.card.g{box-shadow:inset 5px 0 var(--g)}
.card.r{box-shadow:inset 5px 0 var(--r)}
.card.y{box-shadow:inset 5px 0 var(--y)}
.card .th{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:9px;border:1px solid var(--line);display:block;margin-bottom:4px}
.card .hd{display:flex;gap:8px;align-items:center}
.card .no{font-weight:800}
.card .st{margin-left:auto;font-size:12px;font-weight:700;border-radius:999px;padding:2px 8px}
.st.g{background:#e5f6ea;color:var(--g)}
.st.r{background:#fde8e6;color:var(--r)}
.st.y{background:#fff6db;color:var(--y)}
.st.make{background:#eef1f5;color:var(--mute)}
.card .tt{font-size:15px}
.card .meta{font-size:12px;color:var(--mute)}
.card.off{opacity:.55}
#player{display:none;position:fixed;inset:0;background:#0e1116;z-index:20;flex-direction:column}
#player.on{display:flex}
#bar{display:flex;gap:8px;align-items:center;padding:6px 10px;background:#171c24;color:#fff;flex:0 0 auto}
#bar .ttl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
#bar .sec{font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
#stage{flex:1;position:relative;min-height:0;min-width:0}
#stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
#ph{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:#9aa3ad;font-size:20px}
#pbody{flex:1;display:flex;min-height:0}
#side{flex:0 0 30%;max-width:420px;min-width:260px;display:flex;flex-direction:column;background:#12171f;color:#fff;border-left:1px solid #2a3240;min-height:0}
#side .sh{padding:10px 12px;font-weight:800;font-size:15px;border-bottom:1px solid #2a3240}
#side .sh small{display:block;font-weight:400;color:#9aa3ad;font-size:12px;margin-top:2px}
#clist{flex:1 1 auto;min-height:0;overflow-y:auto;padding:4px 12px;font-size:16px;line-height:1.45}
#clist .it{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #2a3240}
#clist .tm{color:#ffd56a;font-weight:800;background:transparent;min-width:56px;min-height:36px}
#clist .tx{flex:1;padding-top:6px;white-space:pre-wrap;word-break:break-word}
#clist .x{background:transparent;color:#fff;min-width:36px;min-height:36px}
#clist .empty{color:#9aa3ad;padding:6px 0}
#dock{display:flex;flex-wrap:wrap;gap:6px;padding:6px 8px;background:#171c24;flex:0 0 auto}
#dock button{flex:1 1 90px;min-height:48px;font-weight:800;font-size:15px;color:#fff}
#bNote{background:#d4a017;color:#1a1300}
#bPass{background:var(--g)}
#bFail{background:var(--r)}
#bSend{background:var(--acc)}
#bBack{background:#2a3240}
#dock button.on{outline:3px solid #fff}
.ov{position:fixed;inset:0;background:rgba(8,10,14,.72);z-index:40;display:none;align-items:center;justify-content:center;padding:12px}
.ov.on{display:flex}
.box{background:#fff;border-radius:16px;width:min(460px,96vw);padding:16px;display:flex;flex-direction:column;gap:10px}
.box p{margin:0;color:var(--mute)}
.box textarea,#nameIn{border:1px solid #c9d0d8;border-radius:10px;padding:10px;min-height:48px;font-size:17px;width:100%}
.box textarea{min-height:96px;resize:vertical}
.row{display:flex;gap:8px}
.row button{flex:1;min-height:48px;font-weight:800}
#cSave,#nameOk{background:var(--acc);color:#fff}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#12351f;color:#fff;border-radius:12px;padding:12px 18px;font-weight:700;display:none;z-index:70;max-width:92vw}
#toast.on{display:block}
</style>
</head>
<body>
<div class="top"><b>看课评审</b><span class="sp"></span><button id="whoBtn" type="button">填名字</button></div>
<div id="home"></div>

<div id="player">
  <div id="bar"><span class="ttl" id="pTtl"></span><span class="sec" id="pSec">00:00</span></div>
  <div id="pbody">
    <div id="stage"><iframe id="lesson" title="lesson"></iframe><div id="ph">制作中</div></div>
    <div id="side"><div class="sh">本课评论<small>点时间跳到那一秒;✕ 删除</small></div><div id="clist"></div></div>
  </div>
  <div id="dock">
    <button id="bNote" type="button">评论</button>
    <button id="bPass" type="button">通过</button>
    <button id="bFail" type="button">不通过</button>
    <button id="bSend" type="button">提交本课反馈</button>
    <button id="bBack" type="button">返回</button>
  </div>
</div>

<div class="ov" id="cmtOv"><div class="box">
  <b id="cmtAt">评论</b>
  <p>课件已暂停。写一句就行,可以写多条。</p>
  <textarea id="txt" placeholder="哪里不对?"></textarea>
  <div class="row"><button id="cCancel" type="button">取消</button><button id="cSave" type="button">保存</button></div>
</div></div>

<div class="ov" id="nameOv"><div class="box">
  <b>先填你的名字</b>
  <p>只在第一次提交前问一次,存在这台设备上,之后不再问。</p>
  <input id="nameIn" autocomplete="name" placeholder="你的名字">
  <button id="nameOk" type="button">确定</button>
</div></div>

<div id="toast"></div>
<script>
const PAGE_ID="c51-feedback-v3";
const KEY="c51tl:"+PAGE_ID;
let DATA=null, SHA={}, st={name:"",v:{},c:{},cur:null};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&s.v&&s.c)st=Object.assign(st,s)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const fmt=s=>{s=Math.max(0,Math.floor(+s||0));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
const lid=l=>{const f=l.file||"";const n=f.split("/").pop()||"";return n.replace(/\.html$/,"")};
const made=l=>l.status!=="制作中"&&!!l.file;
const shaOf=l=>SHA[lid(l)]||"";
const color=l=>{const v=st.v[lid(l)];const sha=shaOf(l);return !v||!sha||v.sha!==sha?"y":v.v};
const comments=l=>(st.c[lid(l)]||[]).filter(x=>x.sha&&x.sha===shaOf(l)).sort((a,b)=>a.s-b.s);

function toast(t){const n=$("toast");n.textContent=t;n.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>n.classList.remove("on"),2400)}
function renderHome(){
  $("whoBtn").textContent=st.name?("👤 "+st.name):"填名字";
  const groups=[];
  DATA.lessons.forEach(l=>{let g=groups.find(x=>x.s===l.subject);if(!g)groups.push(g={s:l.subject,ls:[]});g.ls.push(l)});
  const h=$("home");h.innerHTML="";
  const ready=DATA.lessons.filter(made);
  let ng=0,nr=0;
  groups.forEach(g=>{
    const t=document.createElement("div");t.className="grp";t.textContent=g.s;h.appendChild(t);
    const c=document.createElement("div");c.className="cards";
    g.ls.forEach(l=>{
      const ok=made(l), col=ok?color(l):"";
      if(col==="g")ng++; else if(col==="r")nr++;
      const b=document.createElement("button");
      b.type="button";
      b.className="card"+(ok?" "+col:" off");
      b.dataset.file=l.file||"";
      const badge=ok?(col==="g"?'<span class="st g">通过</span>':col==="r"?'<span class="st r">不通过</span>':'<span class="st y">没判</span>'):'<span class="st make">制作中</span>';
      b.innerHTML=(ok&&l.thumb?'<img class="th" alt="" src="'+l.thumb+'">':'')+'<div class="hd"><span class="no">'+(l.label||("第 "+l.no+" 课"))+'</span>'+badge+'</div><div class="tt"></div><div class="meta"></div>';
      b.querySelector(".tt").textContent=l.title||"";
      const ns=ok?comments(l).length:0;
      b.querySelector(".meta").textContent=(l.style||"")+(ns?" · 意见 "+ns+" 条":"");
      b.disabled=!ok;
      b.onclick=()=>openLesson(l);
      c.appendChild(b);
    });
    h.appendChild(c);
  });
  document.title="看课评审 · 通过 "+ng+" · 不通过 "+nr+" / "+ready.length;
}

let tick=null, pendingS=0, resumeAfter=false, afterName=null;
function curT(){try{const w=$("lesson").contentWindow,s=w.__state&&w.__state();if(s&&isFinite(s.t))return s.t;
  const a=w.document.querySelector("audio,video");if(a&&isFinite(a.currentTime))return a.currentTime}catch(e){}return 0}
function playing(){try{const w=$("lesson").contentWindow,s=w.__state&&w.__state();
  if(s&&typeof s.playing==="boolean")return s.playing;
  const a=w.document.querySelector("audio,video");return a?!a.paused:null}catch(e){return null}}
function pause(){try{const d=$("lesson").contentDocument,b=d.querySelector('[data-cv-ctl="play"]'),on=playing();
  if(b&&on===true)b.click();else if(!b)d.querySelectorAll("audio,video").forEach(a=>{if(!a.paused)a.pause()});
  return on===true}catch(e){return false}}
function resume(){try{const d=$("lesson").contentDocument,b=d.querySelector('[data-cv-ctl="play"]'),on=playing();
  if(b&&on===false)b.click();else if(!b){const a=d.querySelector("audio,video");if(a&&a.paused)a.play().catch(()=>{})}}catch(e){}}
function seek(s){try{const w=$("lesson").contentWindow;if(w.__setTime)w.__setTime(s)}catch(e){}}

function curLesson(){return DATA.lessons.find(l=>lid(l)===st.cur)}
function openLesson(l){
  st.cur=lid(l);save();
  $("player").classList.add("on");
  $("home").style.display="none";
  document.querySelector(".top").style.display="none";
  $("pTtl").textContent=l.subject+" · "+(l.label||("第 "+l.no+" 课"))+" · "+(l.title||"");
  $("lesson").src=l.file;
  markVerdict();renderList();
  clearInterval(tick);tick=setInterval(()=>$("pSec").textContent=fmt(curT()),500);
}
function closeLesson(){
  clearInterval(tick);
  $("player").classList.remove("on");
  $("lesson").src="about:blank";
  document.querySelector(".top").style.display="";
  $("home").style.display="";
  renderHome();
}
function markVerdict(){const l=curLesson();const v=l&&st.v[lid(l)];const on=v&&v.sha===shaOf(l)?v.v:"";
  $("bPass").classList.toggle("on",on==="g");$("bFail").classList.toggle("on",on==="r")}
function renderList(){
  const l=curLesson();const box=$("clist");if(!l){box.innerHTML="";return}
  const cs=comments(l);
  box.innerHTML=cs.length?"":'<div class="empty">还没有评论</div>';
  cs.forEach(it=>{
    const d=document.createElement("div");d.className="it";
    d.innerHTML='<button class="tm" type="button"></button><span class="tx"></span><button class="x" type="button" aria-label="删除">✕</button>';
    d.querySelector(".tm").textContent=fmt(it.s);
    d.querySelector(".tx").textContent=it.c;
    d.querySelector(".tm").onclick=()=>{seek(it.s);pause()};
    d.querySelector(".x").onclick=()=>{st.c[lid(l)]=(st.c[lid(l)]||[]).filter(x=>x!==it);save();renderList();renderHome()};
    box.appendChild(d);
  });
}
function openComment(){
  const l=curLesson();if(!l)return;
  resumeAfter=pause();pendingS=curT();
  $("cmtAt").textContent="⏸ "+fmt(pendingS)+" · "+(l.label||("第 "+l.no+" 课"));
  $("txt").value="";
  $("cmtOv").classList.add("on");
  setTimeout(()=>$("txt").focus(),50);
}
function closeComment(){$("cmtOv").classList.remove("on");if(resumeAfter)resume();resumeAfter=false}
function saveComment(){
  const text=$("txt").value.trim();if(!text){$("txt").focus();return}
  const l=curLesson();if(!l)return;
  const id=lid(l), sha=shaOf(l);
  if(!sha){toast("这节课的校验还没载入,稍后再评");return}
  (st.c[id]=st.c[id]||[]).push({s:Math.round(pendingS*10)/10,c:text,sha,lang:"zh"});
  save();renderList();renderHome();
  $("cmtOv").classList.remove("on");resumeAfter=false;
}
function setVerdict(kind){
  const l=curLesson();if(!l)return;
  const id=lid(l), sha=shaOf(l);
  if(!sha){toast("这节课的校验还没载入,稍后再评");return}
  if(kind==="r"){st.v[id]={v:"r",sha};save();markVerdict();renderHome();openComment();return}
  const v=st.v[id];
  if(v&&v.sha===sha&&v.v==="g")delete st.v[id];else st.v[id]={v:"g",sha};
  save();markVerdict();renderHome();
}
function askName(next){afterName=next||null;$("nameIn").value=st.name||"";$("nameOv").classList.add("on");setTimeout(()=>$("nameIn").focus(),50)}
function confirmName(){
  const n=$("nameIn").value.trim();if(!n){$("nameIn").focus();return}
  st.name=n;save();$("nameOv").classList.remove("on");renderHome();
  const fn=afterName;afterName=null;if(fn)fn();
}
function submitLesson(){
  const l=curLesson();if(!l)return;
  if(!st.name){askName(submitLesson);return}
  const id=lid(l), sha=shaOf(l), col=color(l), cs=comments(l);
  if(!sha){toast("这节课的校验还没载入,稍后再交");return}
  if(col==="y"&&!cs.length){toast("先点通过或不通过,或写一条评论");return}
  const txt=cs.map(x=>"["+fmt(x.s)+"] "+x.c).join("\n");
  const r={},c={};
  if(col!=="y")r[id]=[col,sha.slice(0,8),txt];
  if(cs.length)c[id]=cs.map(x=>({s:x.s,c:x.c,lang:x.lang||"zh"}));
  const mark={g:"🟩",r:"🟥",y:"🟨"}[col];
  const rec={v:1,page:PAGE_ID,reviewer:st.name,lesson:id,sha:sha.slice(0,8),verdict:col,comments:cs.map(x=>({s:x.s,c:x.c,lang:x.lang||"zh"})),note:id+" "+mark+(txt?"\n"+txt:""),ts:new Date().toISOString(),ua:navigator.userAgent.slice(0,120)};
  queuePush(rec);
  $("bSend").disabled=true;toast("正在提交…");
  flushQueue().then(ok=>{$("bSend").disabled=false;
    if(ok){toast("已提交,谢谢");setTimeout(closeLesson,900)}
    else toast("网络不通,已存在本机,恢复后自动补交");});
}
const COLLECT="https://review.ooii.top/submit", QKEY="c51tl:queue";
function queueGet(){try{return JSON.parse(localStorage.getItem(QKEY)||"[]")}catch(e){return[]}}
function queueSet(q){try{localStorage.setItem(QKEY,JSON.stringify(q))}catch(e){}}
function queuePush(r){const q=queueGet();q.push(r);queueSet(q)}
async function flushQueue(){let q=queueGet();
  while(q.length){try{const res=await fetch(COLLECT,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify(q[0])});
      const j=await res.json().catch(()=>({}));if(!res.ok||!j.ok)return false}catch(e){return false}
    q.shift();queueSet(q)}
  return true}
setInterval(()=>{if(queueGet().length)flushQueue()},30000);
window.addEventListener("online",()=>flushQueue());
flushQueue();

$("bNote").onclick=openComment;
$("bPass").onclick=()=>setVerdict("g");
$("bFail").onclick=()=>setVerdict("r");
$("bSend").onclick=submitLesson;
$("bBack").onclick=closeLesson;
$("cCancel").onclick=closeComment;
$("cSave").onclick=saveComment;
$("txt").addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.metaKey||e.ctrlKey))$("cSave").click()});
$("whoBtn").onclick=()=>askName(null);
$("nameOk").onclick=confirmName;
$("nameIn").addEventListener("keydown",e=>{if(e.key==="Enter")confirmName()});

Promise.all([
  fetch("lessons.json").then(r=>r.json()),
  fetch("manifest.json").then(r=>r.ok?r.json():{items:[]}).catch(()=>({items:[]}))
]).then(([d,m])=>{
  DATA=d;
  (m.items||[]).forEach(it=>{if(it.id&&it.sha)SHA[it.id]=it.sha});
  renderHome();
});
</script>
</body>
</html>
