<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>看课评审</title>
<style>
:root{--bg:#f4f6f8;--panel:#fff;--ink:#1c2330;--mute:#6b7480;--line:#e3e7ec;--acc:#2563eb;--g:#16803c;--r:#d23b32;--y:#b8860b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,textarea{font:inherit}
button{border:0;border-radius:12px;cursor:pointer;background:#eef1f5;color:var(--ink)}
.top{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top b{font-size:18px}
#preloadSetting{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--mute)}
#preloadSetting[hidden]{display:none}
#preloadToggle{accent-color:var(--acc)}
.card{position:relative}
.preload-badge{position:absolute;top:5px;right:5px;padding:2px 6px;border-radius:6px;background:var(--panel);color:var(--mute);font-size:11px;line-height:1.2;pointer-events:none}
.card:not(:has(.th)):has(.preload-badge:not([hidden])){padding-top:24px}
@media(max-width:560px){.top:has(#preloadSetting:not([hidden])){flex-wrap:wrap}}
.top .sp{flex:1}
.last{outline:3px solid #f5b301;outline-offset:2px}
#whoBtn{min-height:44px;padding:6px 14px;font-weight:700}
.grp{padding:6px 16px 2px;font-size:13px;color:var(--mute);font-weight:700;letter-spacing:.04em}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;padding:8px 16px 24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:92px}
.card.g{box-shadow:inset 5px 0 var(--g)}
.card.r{box-shadow:inset 5px 0 var(--r)}
.card.y{box-shadow:inset 5px 0 var(--y)}
.card .th{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:9px;border:1px solid var(--line);display:block;margin-bottom:4px}
.card .hd{display:flex;gap:8px;align-items:center}
.card .no{font-weight:800}
.card .st{margin-left:auto;font-size:12px;font-weight:700;border-radius:999px;padding:2px 8px}
.st.g{background:#e5f6ea;color:var(--g)}
.st.r{background:#fde8e6;color:var(--r)}
.st.y{background:#fff6db;color:var(--y)}
.st.make{background:#eef1f5;color:var(--mute)}
.card .unreplied{min-width:20px;border-radius:999px;background:#b92c27;color:#fff;padding:1px 6px;text-align:center;font-size:12px;font-weight:800}
.card .tt{font-size:15px}
.card .meta{font-size:12px;color:var(--mute)}
.mk{display:inline-block;width:6px;height:6px;border-radius:50%;margin-left:3px;vertical-align:middle}
.card.off{opacity:.55}
#player{display:none;position:fixed;inset:0;background:#0e1116;z-index:20;flex-direction:column}
#player.on{display:flex}
#bar{display:flex;gap:8px;align-items:center;padding:6px 10px;background:#171c24;color:#fff;flex:0 0 auto}
#bar .ttl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
#bar .sec{font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
#stage{flex:1;position:relative;min-height:0;min-width:0}
#stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
#ph{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:#9aa3ad;font-size:20px}
#pbody{flex:1;display:flex;min-height:0}
#side{flex:0 0 30%;max-width:420px;min-width:260px;display:flex;flex-direction:column;background:#12171f;color:#fff;border-left:1px solid #2a3240;min-height:0}
#side .sh{padding:10px 12px;font-weight:800;font-size:15px;border-bottom:1px solid #2a3240}
#side .sh small{display:block;font-weight:400;color:#9aa3ad;font-size:12px;margin-top:2px}
#clist{flex:1 1 auto;min-height:0;overflow-y:auto;padding:4px 12px;font-size:16px;line-height:1.45}
#clist .it{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #2a3240}
#clist .tm{color:#ffd56a;font-weight:800;background:transparent;min-width:56px;min-height:36px}
#clist .tx{flex:1;padding-top:6px;white-space:pre-wrap;word-break:break-word}
#clist .x{background:transparent;color:#fff;min-width:36px;min-height:36px}
#clist .empty{color:#9aa3ad;padding:6px 0}
#history{flex:0 1 auto;max-height:65%;min-height:0;overflow-y:auto;border-bottom:1px solid #2a3240}
#history+.sh{flex:0 0 auto}
#history .sh{position:sticky;top:0;background:#12171f}
#historyList{padding:0 12px}
.history-sub{padding:8px 0;border-bottom:1px solid #2a3240;overflow-wrap:anywhere}
.history-sub:last-child{border-bottom:0}
.history-meta{color:#bac3ce;font-size:12px}
.history-entry{margin-top:6px;font-size:14px}
.history-line{display:flex;align-items:flex-start;gap:6px}
.history-line .tm{background:transparent;color:#ffd56a;font-weight:800;padding:0;min-width:48px;min-height:24px}
.history-text,.history-reply{white-space:pre-wrap;overflow-wrap:anywhere}
.history-reply{margin:3px 0 0 54px;color:#d4dce6;font-size:13px}
.history-entry.general .history-reply{margin-left:0}
.history-badge{display:inline-block;border-radius:999px;padding:1px 7px;font-size:12px;font-weight:800}
.history-badge.fixed{background:#d9f4df;color:#145c2e}
.history-badge.nochange,.history-badge.old{background:#e3e8ef;color:#384352}
.history-badge.wip{background:#fff0bd;color:#664600}
.history-badge.unreplied{background:#fce2e1;color:#982a26}
#dock{display:flex;flex-wrap:wrap;gap:6px;padding:6px 8px;background:#171c24;flex:0 0 auto}
#dock button{flex:1 1 90px;min-height:48px;font-weight:800;font-size:15px;color:#fff}
#bNote{background:#d4a017;color:#1a1300}
#bPass{background:var(--g)}
#bFail{background:var(--r)}
#bSend{background:var(--acc)}
#bBack{background:#2a3240}
#bTop{background:#ffd56a;color:#1a1300;font-weight:800;font-size:15px;min-height:36px;padding:4px 14px;border-radius:8px;margin-right:12px;flex:0 0 auto}
#dock button.on{outline:3px solid #fff}
.lng{display:flex;gap:4px;flex:0 0 auto}
.lng button{min-height:36px;min-width:44px;padding:4px 8px;font-weight:800;font-size:14px;border-radius:8px}
.lng button.on{background:var(--acc);color:#fff}
#bar .lng button{background:#2a3240;color:#fff}
#bar .lng button.on{background:var(--acc)}
.ov{position:fixed;inset:0;background:rgba(8,10,14,.72);z-index:40;display:none;align-items:center;justify-content:center;padding:12px}
.ov.on{display:flex}
.box{background:#fff;border-radius:16px;width:min(460px,96vw);padding:16px;display:flex;flex-direction:column;gap:10px}
.box p{margin:0;color:var(--mute)}
.box textarea,#nameIn{border:1px solid #c9d0d8;border-radius:10px;padding:10px;min-height:48px;font-size:17px;width:100%}
.box textarea{min-height:96px;resize:vertical}
.row{display:flex;gap:8px}
.row button{flex:1;min-height:48px;font-weight:800}
#cSave,#nameOk{background:var(--acc);color:#fff}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#12351f;color:#fff;border-radius:12px;padding:12px 18px;font-weight:700;display:none;z-index:70;max-width:92vw}
#toast.on{display:block}
</style>
</head>
<body>
<div class="top"><b data-i="title">看课评审</b><span class="sp"></span><label id="preloadSetting" hidden><input id="preloadToggle" type="checkbox"><span data-i="preload"></span></label><div class="lng"></div><button id="whoBtn" type="button">填名字</button></div>
<div id="home"></div>

<div id="player">
  <div id="bar"><button id="bTop" type="button" data-i="top">← 返回课程列表</button><span class="ttl" id="pTtl"></span><div class="lng"></div><span class="sec" id="pSec">00:00</span></div>
  <div id="pbody">
    <div id="stage"><iframe id="lesson" title="lesson"></iframe><div id="ph" data-i="making">制作中</div></div>
    <div id="side">
      <section id="history" aria-labelledby="historyTitle" hidden>
        <div class="sh" id="historyTitle" data-i="history"></div>
        <div id="historyList"></div>
      </section>
      <div class="sh"><span data-i="cmts">本课评论</span><small data-i="cmtsHint">点时间跳到那一秒;✕ 删除</small></div><div id="clist"></div></div>
  </div>
  <div id="dock">
    <button id="bNote" type="button" data-i="note">评论</button>
    <button id="bPass" type="button" data-i="pass">通过</button>
    <button id="bFail" type="button" data-i="fail">不通过</button>
    <button id="bSend" type="button" data-i="send">提交本课反馈</button>
    <button id="bBack" type="button" data-i="back">← 返回列表</button>
  </div>
</div>

<div class="ov" id="cmtOv"><div class="box">
  <b id="cmtAt">评论</b>
  <p data-i="cmtSub">课件已暂停。写一句就行,可以写多条。</p>
  <textarea id="txt" placeholder="哪里不对?" data-ph="cmtPh"></textarea>
  <div class="row"><button id="cCancel" type="button" data-i="cancel">取消</button><button id="cSave" type="button" data-i="save">保存</button></div>
</div></div>

<div class="ov" id="nameOv"><div class="box">
  <b data-i="nmTtl">先填你的名字</b>
  <p data-i="nmSub">只在第一次提交前问一次,存在这台设备上,之后不再问。</p>
  <input id="nameIn" autocomplete="name" placeholder="你的名字" data-ph="nmPh">
  <button id="nameOk" type="button" data-i="ok">确定</button>
</div></div>

<div id="toast"></div>

function preloadURL(file, sha) {

function paintPreload(entry) {

  let label = "";
  if (entry.state === "cached") label = T("preloadCached");
  else if (preloadOn && !preloadLow) {
    if (entry.state === "downloading") {

    } else label = T(entry.state === "failed" ? "preloadFailed" : "preloadQueued");

function paintPreloadSwitch() {

function stopPreload() {

}

function workerCall(type, entry, { signal, progress } = {}) {
  return new Promise((resolve, reject) => {
    const channel = new MessageChannel();
    const cancel = () => channel.port1.postMessage("cancel");
    function finish() {
      clearTimeout(timeout);
      signal?.removeEventListener("abort", cancel);
      channel.port1.close();
    }
    const timeout = setTimeout(() => {
      cancel();
      finish();
      reject(new Error("Preload worker timed out"));
    }, type === "preload" ? 95000 : 10000);
    channel.port1.onmessage = ({ data }) => {
      if ("percent" in data) {
        if (!signal?.aborted) progress?.(data.percent);
        return;
      }
      finish();
      if (data.error) reject(new Error("Preload worker unavailable"));
      else resolve(data);
    };
    signal?.addEventListener("abort", cancel, { once: true });
    try {
      preloadWorker.postMessage({ type, file: entry?.file, sha: entry?.sha }, [channel.port2]);
      if (signal?.aborted) cancel();
    } catch (error) {
      finish();
      reject(error);
    }
  });
}

function schedulePreload() {
  if (!preloadWorker || !preloadOn || preloadLow || preloadTimer || preloadActive || preloadOpening) return;
  const entry = preloadOrder.find(item => item.state === "queued");
  if (!entry) return;
  preloadTimer = setTimeout(() => {
    preloadTimer = null;
    downloadLesson(entry);
  }, Math.max(0, preloadStart - Date.now()));
}

async function downloadLesson(entry) {
  const aborter = new AbortController();
  preloadActive = { entry, aborter };
  entry.state = "downloading";
  entry.percent = 0;
  paintPreload(entry);
  try {
    // One attempt and at most two retries. A cancellation does not spend a retry.
    for (let attempt = 0; attempt < 3 && !aborter.signal.aborted; attempt++) {
      entry.percent = 0;
      paintPreload(entry);
      const result = await workerCall("preload", entry, {
        signal: aborter.signal,
        progress: percent => {
          entry.percent = percent;
          paintPreload(entry);
        }
      }).catch(() => ({}));
      if (result.cached) {
        entry.state = "cached";
        return;
      }
      if (result.lowStorage) {
        preloadLow = true;
        paintPreloadSwitch();
        return;
      }
    }
    if (!aborter.signal.aborted) entry.state = "failed";
  } finally {
    if (entry.state === "downloading") entry.state = "queued";
    preloadActive = null;
    paintPreload(entry);
    schedulePreload();
  }
}

function setLessonFrame(lesson) {
  const frame = $("lesson");
  const entry = preloadLessons.get(lesson.file);
  if (!entry) {
    frame.src = lesson.file;
    return;
  }
  if (entry.state !== "cached") {
    clearTimeout(preloadTimer);
    preloadTimer = null;
    preloadOpening = { entry };
    if (preloadActive?.entry !== entry) preloadActive?.aborter.abort();
  } else if (preloadLow) {
    preloadOpening = { entry };
  }
  frame.src = entry.key;
}

function lessonFrameLoaded() {
  const opening = preloadOpening;
  const frame = $("lesson");
  if (!opening || frame.src !== opening.entry.key) return;
  try {
    if (frame.contentWindow.location.href === "about:blank") return;
  } catch {}
  refreshOpenedLesson(opening);
}

async function refreshOpenedLesson(opening) {
  if (opening.refreshing) return;
  opening.refreshing = true;
  const entry = opening.entry;
  const result = await workerCall("status", entry).catch(() => ({}));
  if (result.cached) {
    entry.state = "cached";
    paintPreload(entry);
  }
  if (result.lowStorage) {
    preloadLow = true;
    if (result.cached) {
      for (const other of preloadOrder) {
        if (other !== entry && other.state === "cached") other.state = "queued";
      }
    }
    paintPreloadSwitch();
  }
  if (preloadOpening === opening) preloadOpening = null;
  schedulePreload();
}

function waitForPreloadWorker(serviceWorker, script) {
  return new Promise(resolve => {
    const check = () => {
      if (serviceWorker.controller?.scriptURL === script) finish(serviceWorker.controller);
    };
    const finish = worker => {
      clearTimeout(timeout);
      serviceWorker.removeEventListener("controllerchange", check);
      resolve(worker);
    };
    const timeout = setTimeout(() => finish(null), 5000);
    serviceWorker.addEventListener("controllerchange", check);
    check();
  });
}

async function initPreload(manifest) {
  const serviceWorker = navigator.serviceWorker;
  if (!serviceWorker || !Array.isArray(manifest.items)) return;
  const script = new URL("sw.js", new URL("./", location.href)).href;
  try {
    await serviceWorker.register(script, { scope: "./" });
    preloadWorker = await waitForPreloadWorker(serviceWorker, script);
    if (!preloadWorker) return;
    const { keys } = await workerCall("sync");
    const cached = new Set(keys);

    const base = new URL("./", location.href);
    const root = new URL("lessons/", base).pathname;
    for (const item of manifest.items) {
      if (typeof item?.file !== "string" || !/^[a-f0-9]{64}$/.test(item.sha)) continue;
      const key = preloadURL(item.file, item.sha);
      const url = new URL(key);
      if (url.origin !== base.origin || !url.pathname.startsWith(root) ||
          !/^[^/]+\.html$/.test(url.pathname.slice(root.length))) continue;
      preloadLessons.set(item.file, { file: item.file, sha: item.sha, key,
        state: cached.has(key) ? "cached" : "queued" });
    }

    // Use the rendered order because grouping can move cards relative to lessons.json.
    for (const card of $("home").querySelectorAll(".card:not(:disabled)")) {
      const entry = preloadLessons.get(card.dataset.file);
      if (entry && !preloadOrder.includes(entry)) preloadOrder.push(entry);
      renderPreloadBadge(card);
    }
    try {
      const { quota, usage } = await navigator.storage.estimate();
      preloadLow = Number.isFinite(quota) && Number.isFinite(usage) && quota - usage < 2 * 1024 ** 3;
    } catch {}
    paintPreloadSwitch();
    schedulePreload();
  } catch {
    preloadWorker = null;
    preloadLessons.clear();
  }
}

  const badge=document.createElement("span");
  badge.className="unreplied";
  badge.textContent=count;
  badge.title=T("unrepliedCount")(count);
  badge.setAttribute("aria-label",badge.title);
  card.querySelector(".hd").appendChild(badge);
}

async function loadSummary(){
  const request=++summaryRequest;
  const data=await getReviewData("/summary");
  if(request!==summaryRequest)return;
  summary=data?.lessons&&typeof data.lessons==="object"?data.lessons:{};
  $("home").querySelectorAll(".card:not(:disabled)").forEach(card=>{
    renderUnreplied(card,lid({file:card.dataset.file}));
  });
}

async function loadHistory(l){
  const view={items:[]};
  historyView=view;
  renderHistory(l);
  const data=await getReviewData("/thread?lesson="+encodeURIComponent(lid(l)));
  if(historyView!==view||!Array.isArray(data?.items))return;
  view.items=data.items;
  renderHistory(l);
}

const reviewText=value=>typeof value==="string"?value:"";
const lastReply=replies=>Array.isArray(replies)?replies[replies.length-1]:null;
function reviewDate(value){
  const date=new Date(reviewText(value));
  return Number.isFinite(date.getTime())
    ?date.toLocaleDateString("sv-SE",{timeZone:"Asia/Shanghai"}):"";
}

function appendHistoryEntry(group,text,seconds,replies){
  const reply=lastReply(replies);
  const status=HISTORY_STATES.includes(reply?.status)?reply.status:"unreplied";
  const entry=document.createElement("div");
  const timed=Number.isFinite(seconds)&&seconds>=0;
  entry.className="history-entry"+(timed?"":" general");
  entry.innerHTML='<div class="history-line"><span class="history-text"></span></div><div class="history-reply"><span class="history-badge"></span> <span class="history-answer"></span></div>';
  if(timed){
    const time=document.createElement("button");
    time.type="button";
    time.className="tm";
    time.textContent="["+fmt(seconds)+"]";
    time.onclick=()=>{seek(seconds);pause()};
    entry.firstElementChild.prepend(time);
  }
  entry.querySelector(".history-text").textContent=text;
  const badge=entry.querySelector(".history-badge");
  badge.classList.add(status);
  badge.textContent=T(status);
  entry.querySelector(".history-answer").textContent=[reviewText(reply?.text),reviewText(reply?.version)].filter(Boolean).join(" · ");
  group.appendChild(entry);
}

function renderHistory(l){
  const list=$("historyList");
  list.replaceChildren();
  const id=lid(l), currentSha=shaOf(l);
  for(const item of historyView?.items||[]){
    if(!item||typeof item!=="object")continue;
    const cs=Array.isArray(item.comments)?item.comments.filter(c=>reviewText(c?.c).trim()):[];
    const note=reviewText(item.note).trim();
    // The submission form also sends an auto-generated copy of its timed comments.
    const mark={g:"🟩",r:"🟥",y:"🟨"}[reviewText(item.verdict)];
    const generated=[id+" "+mark,...cs.map(c=>"["+fmt(Number.isFinite(c.s)?c.s:0)+"] "+c.c)].join("\n");
    const showNote=lastReply(item.note_replies)||(note&&note!==generated);
    if(!cs.length&&!showNote)continue;
    const group=document.createElement("div");
    group.className="history-sub";
    const meta=document.createElement("div");
    meta.className="history-meta";
    meta.textContent=[reviewText(item.reviewer),reviewDate(item.received_at)].filter(Boolean).join(" · ");
    meta.title=T("beijing");
    const itemSha=reviewText(item.sha);
    if(currentSha&&itemSha&&itemSha!==(itemSha.length===8?currentSha.slice(0,8):currentSha)){
      const old=document.createElement("span");
      old.className="history-badge old";
      old.textContent=T("oldVersion");
      meta.append(" · ",old);
    }
    group.appendChild(meta);
    if(showNote)appendHistoryEntry(group,note===generated?note.split("\n")[0]:note,null,item.note_replies);
    for(const comment of cs)appendHistoryEntry(group,comment.c,comment.s,comment.replies);
    list.appendChild(group);
  }
  $("history").hidden=!list.childElementCount;
}

function queueGet(){try{return JSON.parse(localStorage.getItem(QKEY)||"[]")}catch(e){return[]}}
function queueSet(q){try{localStorage.setItem(QKEY,JSON.stringify(q))}catch(e){}}
function queuePush(r){const q=queueGet();q.push(r);queueSet(q)}
async function flushQueue(){let q=queueGet();
  while(q.length){try{const res=await fetch(COLLECT,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify(q[0])});
      const j=await res.json().catch(()=>({}));if(!res.ok||!j.ok)return false}catch(e){return false}
    q.shift();queueSet(q)}
  return true}
setInterval(()=>{if(queueGet().length)flushQueue()},30000);
window.addEventListener("online",()=>flushQueue());
flushQueue();

      im.onerror=()=>im.remove();w.appendChild(im)}
